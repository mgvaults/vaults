<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Vault</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <script>
    window.tailwind = { config: { suppressDeprecationWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
  <style>
    /* Platform selector pill styling */
    .platform-btn {
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 80px;
    }
    .platform-btn:hover, .platform-btn.active {
        border-color: #6366f1;
        background-color: #1e1b4b;
    }

    /* Fixed thumbnail sizing for queue cards */
    .game-thumb {
        width: 64px;
        height: 80px;
        object-fit: cover;
        border-radius: 0.5rem;
        flex-shrink: 0;
        background-color: #0f172a;
    }

    /* Filter input styling */
    .col-filter {
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        padding: 0.4rem 0.8rem;
        color: #ffffff;
        font-size: 0.875rem;
        outline: none;
    }
    .col-filter:focus {
        border-color: #6366f1;
    }
  </style>
</head>

<body class="bg-slate-900 min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden text-white">
    <div id="mainApp">
        <div class="max-w-7xl mx-auto">
            <!-- Navigation Header -->
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800">
                <div class="flex items-center gap-2">
                   <a href="dashboard.html" title="Home Dashboard" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg flex items-center justify-center hover:bg-indigo-500">🏠</a>
                   <a href="books.html" title="Books Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📚</a>
                   <a href="movies.html" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</a>
                   <button onclick="handleLogout()" title="Lock Vault / Logout" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-indigo-400 uppercase italic">Games Vault</h1>
                <div class="flex items-center gap-2">
                    <div class="toolbox-dropdown">
                        <button title="Toolbox" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="toolbox-menu">
                            <button id="repairBtn" onclick="repairSortOrder()" title="Repair Sort & Dates" class="toolbox-item-icon text-amber-400">🔧</button>
                            <button onclick="downloadTemplate()" title="Download CSV Template" class="toolbox-item-icon">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="toolbox-item-icon">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-indigo-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Archive / Completed" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <!-- Top Dashboard Section -->
            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                <!-- Currently Playing Box -->
                <div id="activeSessionBox" class="lg:col-span-5 bg-indigo-950/20 p-6 rounded-[2.5rem] border border-indigo-500/20 shadow-inner">
                    <h2 class="text-indigo-400 font-black text-sm uppercase tracking-widest mb-5 flex items-center gap-3 italic justify-center text-center">Currently Playing</h2>
                    <div id="col-playing" class="flex flex-col gap-4"></div>
                </div>
                
                <!-- Main Input Form -->
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl relative">
                    <div class="flex flex-col gap-4 relative">
                        <div class="text-[10px] font-black text-indigo-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">Database Search / Entry</span>
                            <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-red-400">Cancel Edit</button>
                        </div>
                        
                        <!-- Title Input with Local Search -->
                        <input id="titleInput" type="text" oninput="searchLocalGames(this.value)" placeholder="Enter game title..." class="w-full bg-slate-900 p-4 rounded-2xl outline-none border border-slate-700 text-white text-base">
                        <div id="searchResults" class="hidden absolute top-[90px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[250px] z-50"></div>
                        
                        <!-- Platform Buttons Selector -->
                        <div class="flex flex-wrap gap-2 justify-center my-1">
                            <button type="button" class="platform-btn active" onclick="selectPlatform('Steam', this)">
                                <span class="font-bold text-xs text-indigo-300">Steam</span>
                            </button>
                            <button type="button" class="platform-btn" onclick="selectPlatform('GOG', this)">
                                <span class="font-bold text-xs text-purple-400">GOG</span>
                            </button>
                            <button type="button" class="platform-btn" onclick="selectPlatform('Epic Games', this)">
                                <span class="font-bold text-xs text-slate-300">Epic</span>
                            </button>
                            <button type="button" class="platform-btn" onclick="selectPlatform('Xbox', this)">
                                <span class="font-bold text-xs text-emerald-400">Xbox</span>
                            </button>
                            <button type="button" class="platform-btn" onclick="selectPlatform('Nintendo Switch', this)">
                                <span class="font-bold text-xs text-red-400">Switch</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input id="genreInput" type="text" placeholder="Genre (e.g., RPG, Action)" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            <input id="yearInput" type="text" placeholder="Release Year" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                        </div>

                        <div class="flex gap-3 relative">
                            <div class="flex-1 flex gap-2">
                                <input id="seriesInput" type="text" placeholder="Game Franchise / Series" class="w-full bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold italic">
                                <input id="seriesNumInput" type="number" step="0.1" placeholder="Entry #" class="w-24 bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            </div>
                            <button onclick="submitForm()" id="submitBtn" class="bg-indigo-600 px-8 rounded-2xl font-black uppercase text-sm text-white hover:bg-indigo-500">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Restored Two-Column Queue View -->
            <div id="queueView" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Column 1: Next Focus -->
                <div class="bg-slate-800/40 p-6 rounded-[2.5rem] border border-slate-800">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-indigo-400 font-black text-sm uppercase tracking-[0.2em]">Next Focus</h2>
                        <input id="filterFocus" type="text" oninput="render()" placeholder="Filter focus..." class="col-filter">
                    </div>
                    <div id="col-focus" class="flex flex-col gap-3 min-h-[350px]"></div>
                </div>
                
                <!-- Column 2: Backlog & Library -->
                <div class="bg-slate-800/40 p-6 rounded-[2.5rem] border border-slate-800">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-slate-400 font-black text-sm uppercase tracking-[0.2em]">Backlog & Library</h2>
                        <input id="filterQueue" type="text" oninput="render()" placeholder="Filter games..." class="col-filter">
                    </div>
                    <div id="col-backlog" class="flex flex-col gap-3 min-h-[350px]"></div>
                </div>
            </div>

            <!-- Alternative Views (Archive/Trash) -->
            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-8">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-center">Archive</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter games..." class="col-filter">
                </div>
                <div id="col-alt" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Wishlist View -->
            <div id="wishlistView" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-indigo-400 font-black text-3xl uppercase tracking-widest italic">Game Wishlist</h2>
                </div>
                <div id="col-wishlist" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        let allGames = [], editingId = null, currentViewMode = 'queue', selectedPlatform = 'Steam';

        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
        });

        function selectPlatform(platform, el) {
            selectedPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        async function loadGames() { 
            let { data, error } = await supabaseClient.from('games').select('*').order('sort_order', { ascending: true }); 
            if (!error) { 
                allGames = data || []; 
                render(); 
            } 
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const gIn = document.getElementById('genreInput');
            const yIn = document.getElementById('yearInput');
            const sIn = document.getElementById('seriesInput');
            const snIn = document.getElementById('seriesNumInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const series = sIn.value.trim() || null;
                const seriesNum = snIn.value ? parseFloat(snIn.value) : null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'Backlog';

                if (editingId) {
                    const cur = allGames.find(g => g.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(),
                        platform: selectedPlatform || (cur ? cur.platform : 'Steam'),
                        genre: gIn.value.trim() || 'Action',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover || (cur ? cur.cover_url : '')
                    };
                    
                    const { error } = await supabaseClient.from('games').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    let next = allGames.length > 0 ? Math.max(...allGames.map(g => g.sort_order || 0)) + 100 : 100;
                    const { error } = await supabaseClient.from('games').insert([{ 
                        title: tIn.value.trim(), 
                        platform: selectedPlatform || 'Steam',
                        genre: gIn.value.trim() || 'Action',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover, 
                        status: defaultStatus, 
                        sort_order: next 
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadGames();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving game: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 

            document.getElementById('genreInput').value = '';
            document.getElementById('yearInput').value = '';
            document.getElementById('seriesInput').value = ''; 
            document.getElementById('seriesNumInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "Database Search / Entry"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
        }

        function render() {
            const fF = (document.getElementById('filterFocus')?.value || '').toLowerCase();
            const fQ = (document.getElementById('filterQueue')?.value || '').toLowerCase();
            const fA = (document.getElementById('filterAlt')?.value || '').toLowerCase();

            const cols = { 
                playing: document.getElementById('col-playing'), 
                focus: document.getElementById('col-focus'),
                backlog: document.getElementById('col-backlog'), 
                alt: document.getElementById('col-alt'), 
                wishlist: document.getElementById('col-wishlist')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });

            if (currentViewMode === 'queue') {
                allGames.filter(g => g.status === 'Currently Playing' || g.status === 'Playing')
                    .forEach(g => cols.playing.appendChild(createCard(g)));
                
                allGames.filter(g => g.status === 'Up Next' || g.status === 'Focus')
                    .filter(g => g.title.toLowerCase().includes(fF) || (g.series && g.series.toLowerCase().includes(fF)))
                    .forEach(g => cols.focus.appendChild(createCard(g)));

                allGames.filter(g => g.status === 'Backlog' || !g.status)
                    .filter(g => g.title.toLowerCase().includes(fQ) || (g.series && g.series.toLowerCase().includes(fQ)))
                    .forEach(g => cols.backlog.appendChild(createCard(g)));
            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Completed' : 'Dropped';
                allGames.filter(g => g.status === target)
                    .filter(g => g.title.toLowerCase().includes(fA) || (g.series && g.series.toLowerCase().includes(fA)))
                    .forEach(g => cols.alt.appendChild(createCard(g)));
            } else if (currentViewMode === 'wishlist') {
                allGames.filter(g => g.status === 'Wishlist')
                    .forEach(g => cols.wishlist.appendChild(createCard(g)));
            }
        }

        function createCard(game) {
            const isS = game.series && game.series.trim() !== '';
            const div = document.createElement('div');
            div.dataset.id = game.id; 
            div.className = `bg-slate-800/90 rounded-2xl p-3 border border-slate-700/80 flex items-center gap-4 relative overflow-hidden ${isS ? 'border-l-4 border-l-amber-500' : ''}`;

            div.innerHTML = `
                <img src="${game.cover_url || 'https://via.placeholder.com/64x80?text=No+Cover'}" class="game-thumb" alt="${game.title}">
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-white text-base truncate">${game.title}</h3>
                    <p class="text-xs text-indigo-400 font-semibold mt-0.5">${game.platform || 'Steam'} • ${game.genre || 'Game'} ${game.release_year ? '(' + game.release_year + ')' : ''}</p>
                    ${game.series ? `<p class="text-xs text-amber-400 italic mt-1">${game.series} ${game.series_num ? '#' + game.series_num : ''}</p>` : ''}
                </div>
                <div class="flex items-center gap-1.5 flex-shrink-0">
                    <button title="Edit" onclick='editGame(${JSON.stringify(game).replace(/'/g, "&apos;")})' class="p-2 hover:bg-slate-700 rounded-lg text-sm">✏️</button>
                    <button title="Currently Playing" onclick="updateStatus('${game.id}', 'Currently Playing')" class="p-2 hover:bg-slate-700 rounded-lg text-sm">🎮</button>
                    <button title="Move to Focus" onclick="updateStatus('${game.id}', 'Focus')" class="p-2 hover:bg-slate-700 rounded-lg text-sm">🎯</button>
                    <button title="Completed" onclick="updateStatus('${game.id}', 'Completed')" class="p-2 hover:bg-slate-700 rounded-lg text-sm">🏆</button>
                    <button title="Delete" onclick="deleteGame('${game.id}')" class="p-2 hover:bg-slate-700 rounded-lg text-sm text-rose-400">✕</button>
                </div>`;
            return div;
        }

        function searchLocalGames(query) {
            const resultsDiv = document.getElementById('searchResults');
            const q = query.trim().toLowerCase();

            if (!q) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                return;
            }

            const matches = allGames.filter(g => g.title.toLowerCase().includes(q));
            if (matches.length === 0) {
                resultsDiv.classList.add('hidden');
                return;
            }

            resultsDiv.innerHTML = matches.map(g => `
                <div onclick="selectLocalGame('${g.title.replace(/'/g, "\\'")}', '${g.genre || ''}', '${g.release_year || ''}', '${g.series || ''}')" 
                     class="p-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700/60 text-left">
                    <p class="text-sm font-bold text-white">${g.title}</p>
                    <p class="text-xs text-slate-400">${g.platform || 'Steam'} • ${g.genre || 'Game'}</p>
                </div>
            `).join('');

            resultsDiv.classList.remove('hidden');
        }

        function selectLocalGame(t, g, y, s) {
            document.getElementById('titleInput').value = t;
            document.getElementById('genreInput').value = g;
            document.getElementById('yearInput').value = y;
            document.getElementById('seriesInput').value = s;
            document.getElementById('searchResults').classList.add('hidden');
        }

        function toggleView(v) { 
            currentViewMode = v;
            const qv = document.getElementById('queueView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'queue') {
                dt.style.display = 'grid'; qv.style.display = 'grid'; as.style.display = 'block'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                qv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; qv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Completed Games Archive' : 'Scrap Yard';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editGame(g) { 
            editingId = g.id; 
            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = g.title; 
            if (g.cover_url) tIn.dataset.img = g.cover_url;

            selectPlatform(g.platform || 'Steam');
            document.getElementById('genreInput').value = g.genre || '';
            document.getElementById('yearInput').value = g.release_year || '';
            document.getElementById('seriesInput').value = g.series || ''; 
            document.getElementById('seriesNumInput').value = g.series_num || ''; 

            document.getElementById('formModeLabel').innerText = "Updating: " + g.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
        }

        function exitEditMode() { resetForm(); toggleView(currentViewMode); }
        async function updateStatus(id, s) { await supabaseClient.from('games').update({ status:s }).eq('id', id); loadGames(); }
        async function deleteGame(id) { if(confirm('Delete game?')) { await supabaseClient.from('games').delete().eq('id', id); loadGames(); } }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
