<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Vault</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <script>
    window.tailwind = { config: { suppressDeprecationWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>

<body class="bg-slate-900 min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">
    <div id="mainApp">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <a href="dashboard.html" title="Home Dashboard" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg flex items-center justify-center hover:bg-indigo-500">🏠</a>
                   <a href="books.html" title="Books Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📚</a>
                   <a href="movies.html" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</a>
                   <button onclick="handleLogout()" title="Lock Vault / Logout" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-indigo-400 uppercase italic">Games Vault</h1>
                <div class="flex items-center gap-2">
                    <div class="toolbox-dropdown">
                        <button title="Toolbox" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="toolbox-menu">
                            <button id="repairBtn" onclick="repairSortOrder()" title="Repair Sort & Dates" class="toolbox-item-icon text-amber-400">🔧</button>
                            <button onclick="downloadTemplate()" title="Download CSV Template" class="toolbox-item-icon">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="toolbox-item-icon">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-indigo-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Archive / Completed" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                <div id="activeSessionBox" class="lg:col-span-5 bg-indigo-950/20 p-6 rounded-[2.5rem] border border-indigo-500/20 shadow-inner">
                    <h2 class="text-indigo-400 font-black text-sm uppercase tracking-widest mb-5 flex items-center gap-3 italic justify-center text-center text-white">Currently Playing</h2>
                    <div id="col-playing" class="flex flex-wrap gap-4 justify-center sm:justify-start"></div>
                </div>
                
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl relative">
                    <div class="flex flex-col gap-4 relative">
                        <div class="text-[10px] font-black text-indigo-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">Database Search / Entry</span>
                            <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-red-400">Cancel Edit</button>
                        </div>
                        
                        <input id="titleInput" type="text" oninput="searchGames(this.value)" placeholder="Search for game title..." class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 text-white text-base">
                        <div id="searchResults" class="hidden absolute top-[110px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[400px] z-50 text-white"></div>
                        
                        <!-- Fixed Platform Selector Grid with Constrained Logos -->
                        <div class="platform-grid my-2">
                            <div class="platform-card" onclick="selectPlatform('Steam', this)">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" class="text-slate-300"><path d="M12 2a10 10 0 0 0-10 10c0 4.74 3.3 8.71 7.74 9.74l2.42-3.44a3.99 3.99 0 0 1-.16-1.12c0-.36.05-.7.14-1.03l-3.07-2.18a3.001 3.001 0 0 1-3.07-2.97c0-1.66 1.34-3 3-3s3 1.34 3 3c0 .12-.01.24-.03.36l3.08 2.19c.47-.23 1-.36 1.56-.36 1.93 0 3.5 1.57 3.5 3.5S18.43 20 16.5 20c-.56 0-1.09-.13-1.56-.36l-2.42 3.44C12.18 23.97 12.09 24 12 24a10 10 0 0 0 0-20z"/></svg>
                                <span class="text-[10px] font-bold text-slate-400 mt-1">Steam</span>
                            </div>
                            <div class="platform-card" onclick="selectPlatform('GOG', this)">
                                <span class="font-black text-xs text-purple-400">GOG</span>
                                <span class="text-[10px] font-bold text-slate-400 mt-1">GOG.com</span>
                            </div>
                            <div class="platform-card" onclick="selectPlatform('Epic Games', this)">
                                <svg width="28" height="32" viewBox="0 0 24 24" fill="currentColor" class="text-slate-300"><path d="M12 0L1.75 3.5v14.25L12 24l10.25-6.25V3.5L12 0zm6.5 15.5l-6.5 3.96-6.5-3.96V6.5l6.5-2.22 6.5 2.22v9deg"/></svg>
                                <span class="text-[10px] font-bold text-slate-400 mt-1">Epic</span>
                            </div>
                            <div class="platform-card" onclick="selectPlatform('Xbox', this)">
                                <span class="font-black text-xs text-emerald-400">XBOX</span>
                                <span class="text-[10px] font-bold text-slate-400 mt-1">Xbox</span>
                            </div>
                            <div class="platform-card" onclick="selectPlatform('Nintendo Switch', this)">
                                <span class="font-black text-xs text-red-500">SWITCH</span>
                                <span class="text-[10px] font-bold text-slate-400 mt-1">Switch</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input id="genreInput" type="text" placeholder="Genre (e.g., RPG, Shooter)" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            <input id="yearInput" type="text" placeholder="Release Year" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                        </div>

                        <div class="flex gap-3 text-white relative">
                            <div class="flex-1 flex gap-2">
                                <input id="seriesInput" type="text" placeholder="Game Franchise / Series" class="w-full bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold italic">
                                <input id="seriesNumInput" type="number" step="0.1" placeholder="Entry #" class="w-24 bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            </div>
                            <button onclick="submitForm()" id="submitBtn" class="bg-indigo-600 px-10 rounded-2xl font-black uppercase text-sm text-white hover:bg-indigo-500">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="queueView">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-slate-400 font-black text-sm uppercase tracking-[0.4em]">Backlog & Library</h2>
                    <input id="filterQueue" type="text" oninput="render()" placeholder="Filter games..." class="col-filter">
                </div>
                <div id="col-backlog" class="flex flex-wrap gap-4 min-h-[450px]"></div>
            </div>

            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-10">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-white text-center">Archive</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter games..." class="col-filter">
                </div>
                <div id="col-alt" class="flex flex-wrap gap-4"></div>
            </div>

            <div id="wishlistView" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-indigo-400 font-black text-3xl uppercase tracking-widest italic">Game Wishlist</h2>
                </div>
                <div id="col-wishlist" class="flex flex-wrap gap-4 justify-center sm:justify-start"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const RAWG_KEY = '5f891df42ee942ef99824f9f4aa29db0';

        let allGames = [], editingId = null, currentViewMode = 'queue', selectedPlatform = 'Steam';

        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
        });

        function selectPlatform(platform, el) {
            selectedPlatform = platform;
            document.querySelectorAll('.platform-card').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
        }

        async function loadGames() { 
            let { data, error } = await supabaseClient.from('games').select('*').order('sort_order', { ascending: true }); 
            if (!error) { 
                allGames = data || []; 
                render(); 
            } 
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const gIn = document.getElementById('genreInput');
            const yIn = document.getElementById('yearInput');
            const sIn = document.getElementById('seriesInput');
            const snIn = document.getElementById('seriesNumInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const series = sIn.value.trim() || null;
                const seriesNum = snIn.value ? parseFloat(snIn.value) : null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'Backlog';

                if (editingId) {
                    const cur = allGames.find(g => g.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(),
                        platform: selectedPlatform || cur.platform || 'PC',
                        genre: gIn.value.trim() || 'Action',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover || cur.cover_url
                    };
                    
                    const { error } = await supabaseClient.from('games').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    let next = allGames.length > 0 ? Math.max(...allGames.map(g => g.sort_order)) + 100 : 100;
                    const { error } = await supabaseClient.from('games').insert([{ 
                        title: tIn.value.trim(), 
                        platform: selectedPlatform || 'PC',
                        genre: gIn.value.trim() || 'Action',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover, 
                        status: defaultStatus, 
                        sort_order: next 
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadGames();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving game item: ${err.message || 'Check database table standard'}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 

            document.getElementById('genreInput').value = '';
            document.getElementById('yearInput').value = '';
            document.getElementById('seriesInput').value = ''; 
            document.getElementById('seriesNumInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "Database Search / Entry"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
        }

        function render() {
            const fQ = document.getElementById('filterQueue').value.toLowerCase();
            const fA = document.getElementById('filterAlt').value.toLowerCase();

            const cols = { 
                playing: document.getElementById('col-playing'), 
                backlog: document.getElementById('col-backlog'), 
                alt: document.getElementById('col-alt'), 
                wishlist: document.getElementById('col-wishlist')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });

            if (currentViewMode === 'queue') {
                allGames.filter(g => g.status === 'Currently Playing' || g.status === 'Playing').forEach(g => cols.playing.appendChild(createCard(g)));
                
                allGames.filter(g => g.status === 'Backlog' || g.status === 'Up Next')
                    .filter(g => g.title.toLowerCase().includes(fQ) || (g.series && g.series.toLowerCase().includes(fQ)))
                    .forEach(g => cols.backlog.appendChild(createCard(g)));
            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Completed' : 'Dropped';
                allGames.filter(g => g.status === target)
                    .filter(g => g.title.toLowerCase().includes(fA) || (g.series && g.series.toLowerCase().includes(fA)))
                    .forEach(g => cols.alt.appendChild(createCard(g)));
            } else if (currentViewMode === 'wishlist') {
                allGames.filter(g => g.status === 'Wishlist')
                    .forEach(g => cols.wishlist.appendChild(createCard(g)));
            }
        }

        function getPlatformBadgeClass(p) {
            if (!p) return 'platform-badge';
            const pl = p.toLowerCase();
            if (pl.includes('gog')) return 'platform-badge gog';
            if (pl.includes('steam')) return 'platform-badge steam';
            if (pl.includes('epic')) return 'platform-badge epic';
            if (pl.includes('playstation') || pl.includes('ps')) return 'platform-badge playstation';
            if (pl.includes('xbox')) return 'platform-badge xbox';
            if (pl.includes('switch') || pl.includes('nintendo')) return 'platform-badge switch';
            return 'platform-badge';
        }

        function createCard(game) {
            const isS = game.series && game.series.trim() !== '';
            const platformClass = getPlatformBadgeClass(game.platform);
            
            const div = document.createElement('div');
            div.dataset.id = game.id; 
            div.className = `poster-card ${isS ? 'series-chained' : ''}`;
            div.title = `${game.title} (${game.platform || 'PC'})`;

            div.innerHTML = `
                <img src="${game.cover_url || ''}" class="poster-cover" alt="${game.title}">
                
                ${game.series_num ? `<span class="series-badge-overlay">#${game.series_num}</span>` : ''}

                <!-- Vertical Action Icons Sidebar -->
                <div class="card-actions-sidebar">
                    <button title="Edit" onclick='editGame(${JSON.stringify(game).replace(/'/g, "&apos;")})' class="action-btn">✏️</button>
                    <button title="Currently Playing" onclick="updateStatus('${game.id}', 'Currently Playing')" class="action-btn ${game.status === 'Currently Playing' || game.status === 'Playing' ? 'active' : ''}">🎮</button>
                    <button title="Completed" onclick="updateStatus('${game.id}', 'Completed')" class="action-btn ${game.status === 'Completed' ? 'active' : ''}">🏆</button>
                    <button title="Wishlist" onclick="updateStatus('${game.id}', 'Wishlist')" class="action-btn ${game.status === 'Wishlist' ? 'active' : ''}">📋</button>
                    <button title="Delete" onclick="deleteGame('${game.id}')" class="action-btn text-rose-400">✕</button>
                </div>`;
            return div;
        }

        function toggleView(v) { 
            currentViewMode = v;
            const qv = document.getElementById('queueView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'queue') {
                dt.style.display = 'grid'; qv.style.display = 'block'; as.style.display = 'block'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                qv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; qv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Completed Games Archive' : 'Scrap Yard';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editGame(g) { 
            editingId = g.id; 
            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = g.title; 
            if (g.cover_url) tIn.dataset.img = g.cover_url;

            selectedPlatform = g.platform || 'Steam';
            document.getElementById('genreInput').value = g.genre || '';
            document.getElementById('yearInput').value = g.release_year || '';
            document.getElementById('seriesInput').value = g.series || ''; 
            document.getElementById('seriesNumInput').value = g.series_num || ''; 

            document.getElementById('formModeLabel').innerText = "Updating: " + g.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
        }

        function exitEditMode() { resetForm(); toggleView(currentViewMode); }
        async function updateStatus(id, s) { await supabaseClient.from('games').update({ status:s }).eq('id', id); loadGames(); }
        async function deleteGame(id) { if(confirm('Delete game?')) { await supabaseClient.from('games').delete().eq('id', id); loadGames(); } }

        async function searchGames(q) { 
            const r = document.getElementById('searchResults'); 
            const trimmedQuery = q ? q.trim() : '';

            if (trimmedQuery.length < 2) { 
                r.classList.add('hidden'); 
                r.innerHTML = '';
                return; 
            } 

            try {
                const response = await fetch(`https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(trimmedQuery)}&page_size=8`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    r.innerHTML = `<div class="p-4 text-sm text-slate-400">No games found.</div>`;
                    r.classList.remove('hidden');
                    return;
                }

                r.innerHTML = data.results.map(item => {
                    const title = (item.name || '').replace(/"/g, '&quot;');
                    const year = item.released ? item.released.split('-')[0] : 'N/A';
                    const cover = item.background_image || '';
                    const genre = (item.genres && item.genres.length > 0) ? item.genres[0].name.replace(/"/g, '&quot;') : 'Action';
                    
                    return `
                        <div onclick="selectGame(&quot;${title}&quot;, &quot;${cover}&quot;, &quot;${genre}&quot;, &quot;${year}&quot;)" 
                             class="p-4 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors">
                            ${cover ? `<img src="${cover}" class="w-12 h-16 object-cover rounded shadow bg-slate-900">` : '<div class="w-12 h-16 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'}
                            <div>
                                <p class="text-sm font-bold text-white">${title}</p>
                                <p class="text-xs text-indigo-400 font-normal mt-0.5">${genre} • ${year}</p>
                            </div>
                        </div>
                    `;
                }).join(''); 
                
                r.classList.remove('hidden');

            } catch (err) {
                r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Search error: ${err.message}</div>`;
                r.classList.remove('hidden');
            }
        }

        function selectGame(t, c, g, y) { 
            const tIn = document.getElementById('titleInput'); 
            tIn.value = t; 
            if (c) tIn.dataset.img = c;
            
            document.getElementById('genreInput').value = g;
            document.getElementById('yearInput').value = y;
            document.getElementById('searchResults').classList.add('hidden'); 
            document.getElementById('seriesInput').focus();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
