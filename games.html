<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Collection - Active Session</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-8 flex justify-center items-start">

  <!-- ==========================================
       GAMES ACTIVE SESSION COMPONENT
     ========================================== -->
  <div class="w-full max-w-md bg-[#0f172a] p-4 rounded-xl border border-indigo-900/50 flex flex-col gap-3 shadow-xl">
    <span class="text-xs font-black italic tracking-wider text-indigo-400 uppercase">Active Session</span>
    
    <div class="flex items-center gap-4 bg-[#1e293b]/50 p-3 rounded-lg border border-slate-700/50 relative">
      <!-- Game Cover -->
      <img src="https://via.placeholder.com/150x220?text=Batman+Cover" alt="Batman: Arkham City" class="w-16 h-22 object-cover rounded-md shadow-md flex-shrink-0" />

      <!-- Details Container -->
      <div class="flex flex-col gap-1 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <!-- Series Tag -->
          <span class="text-[10px] font-bold text-amber-400 bg-amber-950/40 px-2 py-0.5 rounded border border-amber-800/40 truncate">
            ⚡ BATMAN ARKHAM
          </span>
          
          <!-- Status Dropdown Menu Container -->
          <div class="relative status-menu-container">
            <button onclick="toggleMenu(this)" class="p-1.5 rounded-md hover:bg-slate-700/60 text-slate-400 hover:text-white transition-colors" title="Change Status">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
              </svg>
            </button>
            
            <!-- Icon Dropdown Menu -->
            <div class="dropdown-menu absolute right-0 top-full mt-1 hidden flex-row items-center gap-1 bg-[#0f172a] border border-indigo-900/80 p-1.5 rounded-lg shadow-xl z-20">
              <button class="p-2 rounded-md hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Mark as Finished (🏆)">
                <span class="text-base">🏆</span>
              </button>
              <button class="p-2 rounded-md hover:bg-sky-500/20 text-sky-400 transition-colors" title="Move to Next Focus (🎯)">
                <span class="text-base">🎯</span>
              </button>
              <button class="p-2 rounded-md hover:bg-amber-500/20 text-amber-400 transition-colors" title="Move to Backlog (📦)">
                <span class="text-base">📦</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Title & Year -->
        <h4 class="font-bold text-slate-100 text-sm truncate leading-tight">Batman: Arkham City</h4>
        <span class="text-xs text-slate-400">2012</span>

        <!-- Platform Pill -->
        <div class="flex items-center gap-2 mt-1">
          <span class="text-[10px] bg-indigo-900/60 text-indigo-300 px-1.5 py-0.5 rounded uppercase font-semibold">Steam</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Interactive Script for Dropdown Toggle -->
  <script>
    function toggleMenu(button) {
      const container = button.closest('.status-menu-container');
      const menu = container.querySelector('.dropdown-menu');
      
      document.querySelectorAll('.dropdown-menu').forEach(m => {
        if (m !== menu) m.classList.add('hidden');
      });

      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.status-menu-container')) {
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
          menu.classList.add('hidden');
          menu.classList.remove('flex');
        });
      }
    });
  </script>

</body>
</html>
