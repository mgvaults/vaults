    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';

        /*
         * IMPORTANT:
         * Put your existing Supabase anon key here.
         * It has been intentionally omitted from this copy of the code.
         */
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let allGames = [];
        let editingId = null;
        let currentViewMode = 'queue';
        let selectedPlatforms = [];

        /* Cache for current IGDB search results */
        let igdbSearchResults = [];

        const PLAT_MAP = {
            steam: { n:'Steam', c:'#171a21' },
            gog: { n:'GOG', c:'#86328a' },
            epic: { n:'Epic', c:'#313131' },
            battlenet: { n:'BN', c:'#009eff' },
            xbox: { n:'Xbox', c:'#107c10' },
            switch: { n:'Switch', c:'#e60012' },
            playstation: { n:'PS', c:'#003791' },
            amazon: { n:'Luna', c:'#ff9900' }
        };

        /* ============================================================
           PLATFORM DISPLAY PRIORITY
           ============================================================ */

        const PLATFORM_PRIORITY = [
            'playstation',
            'xbox',
            'switch',
            'steam',
            'battlenet',
            'gog',
            'epic',
            'amazon'
        ];

        function sortPlatforms(platforms) {
            return platforms
                .map(p => p.trim().toLowerCase())
                .filter(Boolean)
                .sort((a, b) => {
                    const aIndex = PLATFORM_PRIORITY.indexOf(a);
                    const bIndex = PLATFORM_PRIORITY.indexOf(b);

                    const aPriority = aIndex === -1 ? 999 : aIndex;
                    const bPriority = bIndex === -1 ? 999 : bIndex;

                    return aPriority - bPriority;
                });
        }

        /* ============================================================
           COMPLETION YEARS HELPER
           ============================================================ */

        function getCompletionYears(game) {
            if (!game || !game.completed_years) return [];
            if (Array.isArray(game.completed_years)) {
                return game.completed_years.map(y => String(y).trim()).filter(Boolean);
            }
            if (typeof game.completed_years === 'string') {
                return game.completed_years
                    .split(',')
                    .map(y => y.trim())
                    .filter(Boolean);
            }
            return [];
        }
        function getLatestCompletionYear(game) {
    const years = getCompletionYears(game)
        .map(y => parseInt(y, 10))
        .filter(y => !isNaN(y));
    return years.length > 0 ? Math.max(...years) : 0;
}

        /* ============================================================
           GENRE ICON SYSTEM
           ============================================================ */

        const GENRE_ICONS = {
            'Tactical': { icon: '🎯', label: 'Tactical' },
            'Shooter': { icon: '🔫', label: 'Shooter' },
            'Puzzle': { icon: '🧩', label: 'Puzzle' },
            'Real Time Strategy (RTS)': { icon: '🧠', label: 'Real Time Strategy (RTS)' },
            'Strategy': { icon: '♟️', label: 'Strategy' },
            'Turn-based strategy (TBS)': { icon: '🎲', label: 'Turn-Based Strategy' },
            'Hack and slash/Beat \'em up': { icon: '🥊', label: 'Hack and Slash / Beat \'em Up' },
            'Action': { icon: '⚡', label: 'Action' },
            'Adventure': { icon: '🗺️', label: 'Adventure' },
            'Role-playing (RPG)': { icon: '🛡️', label: 'RPG' },
            'Stealth': { icon: '🥷', label: 'Stealth' },
            'Platform': { icon: '🏃', label: 'Platform' },
            'Racing': { icon: '🏎️', label: 'Racing' },
            'Fighting': { icon: '👊', label: 'Fighting' },
            'Horror': { icon: '👻', label: 'Horror' },
            'Simulator': { icon: '🔧', label: 'Simulator' },
            'Sport': { icon: '🏆', label: 'Sports' },
            'Music': { icon: '🎵', label: 'Music' },
            'Arcade': { icon: '🕹️', label: 'Arcade' },
            'Point-and-click': { icon: '🖱️', label: 'Point-and-Click' },
            'MMO': { icon: '🌐', label: 'MMO' },
            'Card & Board Game': { icon: '🃏', label: 'Card & Board Game' },
            'Quiz/Trivia': { icon: '❓', label: 'Quiz/Trivia' },
            'Pinball': { icon: '🎯', label: 'Pinball' },
            'Visual Novel': { icon: '📖', label: 'Visual Novel' },
            'Indie': { icon: '💎', label: 'Indie' }
        };

        const GENRE_PRIORITY = [
            'Point-and-click',
            'Tactical',
            'Shooter',
            'Real Time Strategy (RTS)',
            'Turn-based strategy (TBS)',
            'Strategy',
            'Hack and slash/Beat \'em up',
            'Action',
            'Adventure',
            'Puzzle',
            'Role-playing (RPG)',
            'Stealth',
            'Platform',
            'Racing',
            'Fighting',
            'Horror',
            'Sport',
            'Music',
            'Arcade',
            'MMO',
            'Card & Board Game',
            'Quiz/Trivia',
            'Pinball',
            'Visual Novel',
            'Simulator',
            'Indie'
        ];

        function normaliseGenreName(genre) {
            const value = (genre || '').trim();
            const aliases = {
                'Real-time strategy (RTS)': 'Real Time Strategy (RTS)',
                'Real Time Strategy (RTS)': 'Real Time Strategy (RTS)',
                'Turn-based strategy (TBS)': 'Turn-based strategy (TBS)',
                'Role-Playing (RPG)': 'Role-playing (RPG)',
                'RPG': 'Role-playing (RPG)',
                'Hack and Slash/Beat \'Em Up': 'Hack and slash/Beat \'em up',
                'Hack and Slash/Beat \'em Up': 'Hack and slash/Beat \'em up',
                'Hack and slash / Beat \'em up': 'Hack and slash/Beat \'em up',
                'Hack & Slash/Beat \'em Up': 'Hack and slash/Beat \'em up',
                'Point and Click': 'Point-and-click',
                'Sports': 'Sport'
            };

            return aliases[value] || value;
        }
        function splitGenres(genreString) {
            if (!genreString) return [];
            const separator = genreString.includes('|') ? '|' : ',';
            return genreString
                .split(separator)
                .map(g => normaliseGenreName(g))
                .map(g => g.trim())
                .filter(Boolean);
        }
        function sortGenres(genres) {
            const uniqueGenres = [...new Set(
                genres.map(g => normaliseGenreName(g)).filter(Boolean)
            )];

            return uniqueGenres.sort((a, b) => {
                const aIndex = GENRE_PRIORITY.indexOf(a);
                const bIndex = GENRE_PRIORITY.indexOf(b);
                const aPriority = aIndex === -1 ? 999 : aIndex;
                const bPriority = bIndex === -1 ? 999 : bIndex;
                if (aPriority !== bPriority) {
                    return aPriority - bPriority;
                }
                return a.localeCompare(b);
            });
        }
        function getGenreIconData(genre) {
            const normalised = normaliseGenreName(genre);
            if (GENRE_ICONS[normalised]) {
                return GENRE_ICONS[normalised];
            }
            const lower = normalised.toLowerCase();

            if (
                lower.includes('real time strategy') ||
                lower.includes('real-time strategy')
            ) {
                return GENRE_ICONS['Real Time Strategy (RTS)'];
            }

            if (
                lower.includes('hack and slash') ||
                lower.includes('beat \'em up')
            ) {
                return GENRE_ICONS['Hack and slash/Beat \'em up'];
            }

            if (
                lower === 'rpg' ||
                lower.includes('role-playing')
            ) {
                return GENRE_ICONS['Role-playing (RPG)'];
            }

            if (lower.includes('turn-based strategy')) {
                return GENRE_ICONS['Turn-based strategy (TBS)'];
            }

            return {
                icon: '🎮',
                label: normalised
            };
        }

        function renderGenreIcons(genreString) {
            const genres = sortGenres(splitGenres(genreString));

            if (genres.length === 0) return '';

            return genres.map(genre => {
                const match = getGenreIconData(genre);

                return `
                    <span
                        class="genre-icon"
                        title="${match.label.replace(/"/g, '&quot;')}"
                        aria-label="${match.label.replace(/"/g, '&quot;')}"
                    >${match.icon}</span>
                `;
            }).join('');
        }

        function getStoredGenreString(genres) {
            const sorted = sortGenres(genres);
            return sorted.join('|');
        }

            return sortGenres(splitGenres(genreString)).join(', ');

                } else {
                    showAuth();
                }

        /* ============================================================
           LOAD GAMES
           ============================================================ */

        async function loadGames() {
            let { data, error } = await supabaseClient
                .from('games')
                .select('*')
                .order('sort_order', { ascending: true });

            if (!error) {
                allGames = data || [];
                render();
            }
        }

        function toggleToolbox(e) {
            if (e) e.stopPropagation();

            const menu = document.getElementById('toolboxMenu');

            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function toggleP(p) {
            if (selectedPlatforms.includes(p)) {
                selectedPlatforms = selectedPlatforms.filter(x => x !== p);
            } else {
                selectedPlatforms.push(p);
            }

            document.getElementById(`i-${p}`).classList.toggle('active');
        }

        function parseReleaseDate(val) {
            if (
                val === undefined ||
                val === null ||
                val === 'null' ||
                val === 'undefined' ||
                val === ''
            ) {
                return null;
            }

            let num = Number(val);

            if (isNaN(num) || num <= 0) {
                return null;
            }

            if (num > 32503680000) {
                num = Math.floor(num / 1000);
            }

            return num;
        }

        /* ============================================================
           SAVE
           ============================================================ */

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const sIn = document.getElementById('seriesInput');
            const cYIn = document.getElementById('completedYearsInput');

            if (!tIn.value.trim()) return;

            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const genre = tIn.dataset.genre || '';
                const releaseDate = parseReleaseDate(tIn.dataset.release);
                const series = sIn.value.trim() || null;
                const completedYears = cYIn.value.trim() || null;

                let defaultStatus =
                    currentViewMode === 'wishlist'
                        ? 'Wishlist'
                        : (currentViewMode === 'archive' ? 'Finished' : 'Backlog');

                if (editingId) {

                    const cur = allGames.find(g => g.id === editingId);

                    const payload = {
                        title: tIn.value.trim(),
                        series,
                        platform: selectedPlatforms.join(','),
                        cover_url: cover || cur.cover_url,
                        genre: genre || cur.genre,
                        release_date:
                            releaseDate !== null
                                ? releaseDate
                                : cur.release_date,
                        completed_years: completedYears
                    };

                    if (series && series !== cur.series) {

                        const buddies = allGames.filter(
                            g => g.series === series
                        );

                        if (buddies.length > 0) {
                            payload.sort_order =
                                Math.max(...buddies.map(g => g.sort_order)) + 1;
                        }
                    }

                    const { error } = await supabaseClient
                        .from('games')
                        .update(payload)
                        .eq('id', editingId);

                    if (error) throw error;

                } else {

                    let next =
                        allGames.length > 0
                            ? Math.max(...allGames.map(g => g.sort_order)) + 100
                            : 100;

                    if (series) {

                        const buddies = allGames.filter(
                            g => g.series === series
                        );

                        if (buddies.length > 0) {
                            next =
                                Math.max(
                                    ...buddies.map(g => g.sort_order)
                                ) + 1;
                        }
                    }

                    // Default completion year if status is Finished and none specified
                    const finalCompletedYears =
                        (defaultStatus === 'Finished' && !completedYears)
                            ? String(new Date().getFullYear())
                            : completedYears;

                    const { error } = await supabaseClient
                        .from('games')
                        .insert([{
                            title: tIn.value.trim(),
                            platform: selectedPlatforms.join(','),
                            series,
                            cover_url: cover,
                            genre: genre || 'Game',
                            release_date: releaseDate,
                            status: defaultStatus,
                            sort_order: next,
                            completed_years: finalCompletedYears
                        }]);

                    if (error) throw error;
                }

                resetForm();
                await loadGames();

            } catch (err) {

                console.error("Save failed:", err);

                alert(
                    `Error saving game: ${
                        err.message || 'Check database columns'
                    }`
                );

            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() {
            editingId = null;

            const tIn = document.getElementById('titleInput');

            tIn.value = '';

            delete tIn.dataset.img;
            delete tIn.dataset.genre;
            delete tIn.dataset.release;

            document.getElementById('seriesInput').value = '';
            document.getElementById('completedYearsInput').value = '';

            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('seriesResults').classList.add('hidden');
            document.getElementById('seriesResults').innerHTML = '';

            igdbSearchResults = [];

            selectedPlatforms = [];

            document
                .querySelectorAll('.plat-box')
                .forEach(el => el.classList.remove('active'));

            document.getElementById('submitBtn').innerText = "Commit";
            document.getElementById('formModeLabel').innerText = "Search";

            document.getElementById('cancelEdit').classList.add('hidden');
            document.getElementById('deleteSelectedBtn').classList.add('hidden');

        /* ============================================================
           RENDER
           ============================================================ */

        function render() {

            const fN =
                document.getElementById('filterNext').value.toLowerCase();

            const fB =
                document.getElementById('filterBacklog').value.toLowerCase();

            const fA =
                document.getElementById('filterAlt').value.toLowerCase();

            const fWR =
                document
                    .getElementById('filterWishlistReleased')
                    .value
                    .toLowerCase();

            const fWU =
                document
                    .getElementById('filterWishlistUpcoming')
                    .value
                    .toLowerCase();

            const cols = {
                playing: document.getElementById('col-playing'),
                next: document.getElementById('col-next'),
                backlog: document.getElementById('col-backlog'),
                alt: document.getElementById('col-alt'),
                wishlistReleased:
                    document.getElementById('col-wishlist-released'),
                wishlistUpcoming:
                    document.getElementById('col-wishlist-upcoming')
            };

            Object.values(cols).forEach(c => {
                if (c) c.innerHTML = '';
            });

            const nextPri = {
                'Up Next': 0,
                'Started': 1
            };

            const nowSec = Math.floor(Date.now() / 1000);

            if (currentViewMode === 'queue') {

                const activeGames =
                    allGames.filter(g => g.status === 'Playing');

                if (activeGames.length > 0) {

                    activeGames.forEach(g =>
                        cols.playing.appendChild(createActiveCard(g))
                    );

                } else {

                    cols.playing.innerHTML =
                        `<p class="text-slate-500 text-sm font-semibold italic">Not Currently Playing</p>`;
                }

                allGames
                    .filter(g =>
                        ['Up Next', 'Started'].includes(g.status)
                    )
                    .filter(g =>
                        g.title.toLowerCase().includes(fN) ||
                        (g.series &&
                            g.series.toLowerCase().includes(fN))
                    )
                    .sort((a, b) =>
                        nextPri[a.status] - nextPri[b.status] ||
                        a.sort_order - b.sort_order
                    )
                    .forEach(g =>
                        cols.next.appendChild(createCard(g))
                    );

                allGames
                    .filter(g =>
                        [
                            'Backlog',
                            'Game Pass',
                            'PS Plus',
                            'Switch Online',
                            'Downloaded'
                        ].includes(g.status)
                    )
                    .filter(g =>
                        g.title.toLowerCase().includes(fB) ||
                        (g.series &&
                            g.series.toLowerCase().includes(fB))
                    )
                    .forEach(g =>
                        cols.backlog.appendChild(createCard(g))
                    );

            } else if (currentViewMode === 'archive') {

    allGames
        .filter(g => g.status === 'Finished')
        .filter(g =>
            g.title.toLowerCase().includes(fA) ||
            (g.series && g.series.toLowerCase().includes(fA))
        )
        .sort((a, b) => {
            const yearA = getLatestCompletionYear(a);
            const yearB = getLatestCompletionYear(b);

            if (yearB !== yearA) {
                return yearB - yearA; // Latest year first
            }

            return a.title.localeCompare(b.title); // Alphabetical tie-breaker
        })
        .forEach(g =>
            cols.alt.appendChild(createArchiveCard(g))
        );

}

            } else if (currentViewMode === 'wishlist') {

                const wishlistGames =
                    allGames.filter(g => g.status === 'Wishlist');

                const sortByReleaseDate = (a, b) => {

                    const dA = parseReleaseDate(a.release_date);
                    const dB = parseReleaseDate(b.release_date);

                    if (dA === null && dB === null) return 0;
                    if (dA === null) return 1;
                    if (dB === null) return -1;

                    return dA - dB;
                };

                wishlistGames
                    .filter(g => {
                        const rDate =
                            parseReleaseDate(g.release_date);

                        return rDate !== null && rDate <= nowSec;
                    })
                    .filter(g =>
                        g.title.toLowerCase().includes(fWR) ||
                        (g.series &&
                            g.series.toLowerCase().includes(fWR))
                    )
                    .sort(sortByReleaseDate)
                    .forEach(g =>
                        cols.wishlistReleased.appendChild(createCard(g))
                    );

                wishlistGames
                    .filter(g => {
                        const rDate =
                            parseReleaseDate(g.release_date);

                        return rDate === null || rDate > nowSec;
                    })
                    .filter(g =>
                        g.title.toLowerCase().includes(fWU) ||
                        (g.series &&
                            g.series.toLowerCase().includes(fWU))
                    )
                    .sort(sortByReleaseDate)
                    .forEach(g =>
                        cols.wishlistUpcoming.appendChild(createCard(g))
                    );
            }
        }

                ia.classList.add('lg:col-span-7');

                av.style.display = 'none';
                wv.style.display = 'none';

            } else if (v === 'wishlist') {

                dt.style.display = 'grid';
                as.style.display = 'none';

                ia.classList.remove('lg:col-span-7');
                ia.classList.add('lg:col-span-12');

                qv.style.display = 'none';
                av.style.display = 'none';
                wv.style.display = 'block';

            } else {

                dt.style.display = 'none';
                qv.style.display = 'none';
                wv.style.display = 'none';
                av.style.display = 'block';

                document.getElementById('altTitle').innerText =
                    'Archive';

                document.getElementById('altTitle').style.color =
                    '#34d399';
            }

            render();
        }

        /* ============================================================
           EDIT
           ============================================================ */

        function editL(g) {

            editingId = g.id;

            const dt =
                document.getElementById('dashboardTop');

            const as =
                document.getElementById('activeSessionBox');

            const ia =
                document.getElementById('inputArea');

            dt.style.display = 'grid';

            if (currentViewMode !== 'queue') {

                as.style.display = 'none';

                ia.classList.remove('lg:col-span-7');
                ia.classList.add('lg:col-span-12');
            }

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

            const tIn =
                document.getElementById('titleInput');

            tIn.value = g.title;

            if (g.cover_url) {
                tIn.dataset.img = g.cover_url;
            }

            if (g.genre) {
                tIn.dataset.genre = g.genre;
            }

            if (
                g.release_date !== null &&
                g.release_date !== undefined
            ) {
                tIn.dataset.release = g.release_date;
            }

            document.getElementById('formModeLabel').innerText =
                "Updating: " + g.title;

            document.getElementById('cancelEdit')
                .classList.remove('hidden');

            document.getElementById('deleteSelectedBtn')
                .classList.remove('hidden');

            selectedPlatforms =
                (g.platform || '')
                    .split(',')
                    .filter(x => x.trim())
                    .map(x => x.trim());

            document
                .querySelectorAll('.plat-box')
                .forEach(el => {

                    el.classList.toggle(
                        'active',
                        selectedPlatforms.includes(
                            el.id.replace('i-', '')
                        )
                    );

                });

            document.getElementById('seriesInput').value =
                g.series || '';

            document.getElementById('completedYearsInput').value =
                getCompletionYears(g).join(', ');
        }

        function exitEditMode() {
            resetForm();
            toggleView(currentViewMode);
        }

        async function deleteSelectedFromForm() {

            if (!editingId) return;

            if (
                confirm(
                    "Are you sure you want to delete this game?"
                )
            ) {

                await supabaseClient
                    .from('games')
                    .delete()
                    .eq('id', editingId);

                resetForm();
                loadGames();
            }
        }

        /* ============================================================
           REPAIR SORT ORDER
           ============================================================ */

        async function repairSortOrder() {

            const b =
                document.getElementById('repairBtn');

            b.innerText = "⏳";

            try {

                let list =
                    [...allGames].sort(
                        (a, b) =>
                            a.sort_order - b.sort_order
                    );

                let finalOrder = [];
                let processedSeries = new Set();

                for (let g of list) {

                    if (processedSeries.has(g.series)) {
                        continue;
                    }

                    if (g.series) {

                        let buddies =
                            list.filter(
                                item =>
                                    item.series === g.series
                            );

                        finalOrder.push(...buddies);
                        processedSeries.add(g.series);

                    } else {

                        finalOrder.push(g);
                    }
                }

                for (
                    let i = 0;
                    i < finalOrder.length;
                    i++
                ) {

                    await supabaseClient
                        .from('games')
                        .update({
                            sort_order: (i + 1) * 100
                        })
                        .eq(
                            'id',
                            finalOrder[i].id
                        );
                }

                alert("Vault rebuild complete!");

            } catch (err) {

                alert(
                    `Rebuild error: ${err.message}`
                );

            } finally {

                b.innerText = "🔧";
                loadGames();
            }
        }

        /* ============================================================
           STATUS
           ============================================================ */

        async function updateStatus(id, s) {

            const cur = allGames.find(g => g.id === id);
            let payload = { status: s };

            if (s === 'Finished') {
                const existingYears = getCompletionYears(cur);
                if (existingYears.length === 0) {
                    payload.completed_years = String(new Date().getFullYear());
                }
            }

            await supabaseClient
                .from('games')
                .update(payload)
                .eq('id', id);

            loadGames();
        }

        /* ============================================================
           SORTABLE
           ============================================================ */

        function initSortable() {

            ['col-next', 'col-backlog'].forEach(id => {

                const el =
                    document.getElementById(id);

                if (!el) return;

                new Sortable(el, {

                    group: 'games',
                    animation: 250,

                    onEnd: async (evt) => {

                        let targetS = 'Backlog';

                        if (
                            evt.to.id === 'col-next'
                        ) {
                            targetS = 'Up Next';
                        }

                        const items =
                            Array.from(
                                evt.to.children
                            );

                        for (
                            let i = 0;
                            i < items.length;
                            i++
                        ) {

                            await supabaseClient
                                .from('games')
                                .update({
                                    sort_order:
                                        (i + 1) * 100,
                                    status: targetS
                                })
                                .eq(
                                    'id',
                                    items[i].dataset.id
                                );
                        }

                        loadGames();
                    }
                });
            });
        }

        /* ============================================================
           SERIES DROPDOWN
           ============================================================ */

        function filterSeriesDropdown(val) {

            const sr =
                document.getElementById('seriesResults');

            const existingSeries =
                Array.from(
                    new Set(
                        allGames
                            .map(g => g.series)
                            .filter(
                                s =>
                                    s &&
                                    s.trim() !== ''
                            )
                    )
                );

            const filtered =
                existingSeries.filter(
                    s =>
                        s
                            .toLowerCase()
                            .includes(
                                val.toLowerCase().trim()
                            )
                );

            if (filtered.length === 0) {

                sr.classList.add('hidden');
                return;
            }

            sr.innerHTML =
                filtered
                    .map(
                        s =>
                            `<div onclick="selectSeries('${s.replace(/'/g, "\\'")}')" class="p-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700/60 text-left text-white font-bold text-xs truncate transition-colors">${s}</div>`
                    )
                    .join('');

            sr.classList.remove('hidden');
        }

        function selectSeries(name) {

            document.getElementById(
                'seriesInput'
            ).value = name;

            document.getElementById(
                'seriesResults'
            ).classList.add('hidden');
        }

        /* ============================================================
           DOCUMENT CLICK HANDLER
           ============================================================ */

        document.addEventListener('click', (e) => {

            if (
                !e.target.closest('#seriesInput') &&
                !e.target.closest('#seriesResults')
            ) {

                document
                    .getElementById('seriesResults')
                    .classList.add('hidden');
            }

            if (
                !e.target.closest('#titleInput') &&
                !e.target.closest('#searchResults')
            ) {

                document
                    .getElementById('searchResults')
                    .classList.add('hidden');
            }

            if (
                !e.target.closest('#toolboxContainer')
            ) {

                const menu =
                    document.getElementById(
                        'toolboxMenu'
                    );

                if (menu) {

                    menu.classList.add('hidden');
                    menu.classList.remove('flex');
                }
            }
        });

        /* ============================================================
           IGDB GAME SEARCH
           ============================================================ */

        async function searchGames(q) {

            const r =
                document.getElementById(
                    'searchResults'
                );

            const trimmedQuery =
                q ? q.trim() : '';

            if (trimmedQuery.length < 2) {

                r.classList.add('hidden');
                r.innerHTML = '';
                igdbSearchResults = [];

                return;
            }

            try {

                const response =
                    await fetch(
                        `${SB_URL}/functions/v1/igdb-search`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json',
                                'apikey':
                                    SB_KEY
                            },

                            body: JSON.stringify({
                                query:
                                    trimmedQuery
                            })
                        }
                    );

                const results =
                    await response.json();

                if (
                    !results ||
                    results.length === 0
                ) {

                    igdbSearchResults = [];

                    r.innerHTML =
                        `<div class="p-4 text-sm text-slate-400">No results found.</div>`;

                    r.classList.remove(
                        'hidden'
                    );

                    return;
                }

                igdbSearchResults =
                    results.map(g => {

                        const genres =
                            (
                                g.genres &&
                                g.genres.length
                            )
                                ? g.genres
                                    .map(
                                        x =>
                                            x.name
                                    )
                                    .filter(Boolean)
                                : [];

                        const sortedGenres =
                            sortGenres(genres);

                        const genreString =
                            sortedGenres.length
                                ? sortedGenres.join('|')
                                : 'Game';

                        const cover =
                            g.cover?.image_id
                                ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${g.cover.image_id}.jpg`
                                : '';

                        const release =
                            g.first_release_date !==
                            undefined
                                ? g.first_release_date
                                : '';

                        return {
                            title:
                                g.name || '',
                            cover,
                            genre:
                                genreString,
                            displayGenre:
                                sortedGenres.length
                                    ? sortedGenres.join(
                                        ', '
                                    )
                                    : 'Game',
                            release
                        };
                    });

                r.innerHTML =
                    igdbSearchResults
                        .map((g, index) => {

                            const yearLabel =
                                g.release
                                    ? new Date(
                                        g.release *
                                        1000
                                    ).getFullYear()
                                    : 'TBA';

                            return `
                                <div
                                    onclick="selectGame(${index})"
                                    class="p-3 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors"
                                >

                                    ${
                                        g.cover
                                            ? `<img src="${g.cover}" class="w-10 h-14 object-cover rounded shadow bg-slate-900">`
                                            : '<div class="w-10 h-14 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'
                                    }

                                    <div class="min-w-0">

                                        <p class="text-sm font-bold text-white truncate">
                                            ${g.title}
                                        </p>

                                        <p class="text-xs text-slate-400 font-normal uppercase mt-0.5">
                                            ${g.displayGenre} • ${yearLabel}
                                        </p>

                                    </div>

                                </div>
                            `;
                        })
                        .join('');

                r.classList.remove('hidden');

            } catch (err) {

                igdbSearchResults = [];

                r.innerHTML =
                    `<div class="p-4 text-sm text-rose-400 font-bold">Network error: ${err.message}</div>`;

                r.classList.remove('hidden');
            }
        }

        function selectGame(index) {

            const selected =
                igdbSearchResults[index];

            if (!selected) return;

            const tIn =
                document.getElementById(
                    'titleInput'
                );

            tIn.value =
                selected.title;

            document
                .getElementById(
                    'searchResults'
                )
                .classList.add('hidden');

            if (selected.cover) {
                tIn.dataset.img =
                    selected.cover;
            } else {
                delete tIn.dataset.img;
            }

            if (selected.genre) {
                tIn.dataset.genre =
                    selected.genre;
            } else {
                delete tIn.dataset.genre;
            }

            const parsedDate =
                parseReleaseDate(
                    selected.release
                );

            if (parsedDate !== null) {
                tIn.dataset.release =
                    parsedDate;
            } else {
                delete tIn.dataset.release;
            }

            document
                .getElementById(
                    'seriesInput'
                )
                .focus();
        }

        /* ============================================================
           CSV TEMPLATE
           ============================================================ */

        function downloadTemplate() {

            const csv =
                "title,platform,series,genre,status,cover_url\n" +
                "Elden Ring,steam,,RPG,Backlog,https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg";

            const blob =
                new Blob(
                    [csv],
                    {
                        type: 'text/csv'
                    }
                );

            const a =
                document.createElement('a');

            a.href =
                URL.createObjectURL(blob);

            a.download =
                'vault_template.csv';

            a.click();
        }

        /* ============================================================
           CSV IMPORT
           ============================================================ */

        document
            .getElementById('csvFile')
            .addEventListener(
                'change',
                function(e) {

                    const r =
                        new FileReader();

                    r.onload =
                        async (ev) => {

                            const rows =
                                ev.target.result
                                    .split('\n')
                                    .slice(1);

                            const gToInsert =
                                rows
                                    .map(r => {

                                        const cols =
                                            r
                                                .split(',')
                                                .map(
                                                    x =>
                                                        x?.trim()
                                                );

                                        if (cols[0]) {

                                            return {
                                                title:
                                                    cols[0],

                                                platform:
                                                    cols[1] ||
                                                    'PC',

                                                series:
                                                    cols[2] ||
                                                    null,

                                                genre:
                                                    cols[3] ||
                                                    'Action',

                                                status:
                                                    cols[4] ||
                                                    'Backlog',

                                                cover_url:
                                                    cols[5] ||
                                                    '',

                                                sort_order:
                                                    100
                                            };
                                        }
                                    })
                                    .filter(x => x);

                            await supabaseClient
                                .from('games')
                                .insert(
                                    gToInsert
                                );

                            loadGames();
                        };

                    r.readAsText(
                        e.target.files[0]
                    );
                }
            );

        /* ============================================================
           START
           ============================================================ */

        initAuth();
    </script>
