<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Vault</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom External Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- SortableJS for drag-and-drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Shared Centralized Auth Logic -->
  <script src="auth.js" defer></script>
</head>

<body class="bg-slate-900 min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">
    <div id="mainApp">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <a href="dashboard.html" title="Home Dashboard" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg flex items-center justify-center">🏠</a>
                   <button onclick="handleLogout()" title="Lock Vault / Logout" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                   <button onclick="downloadTemplate()" title="CSV Template" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">💾</button>
                   <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📥</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-indigo-500 uppercase italic">Games Vault</h1>
                <div class="flex gap-2">
                    <button id="repairBtn" onclick="repairSortOrder()" title="Repair All Sorting & Release Dates" class="p-2.5 px-4 bg-amber-900/20 text-amber-500 border border-amber-900/50 rounded-xl text-2xl transition hover:bg-amber-600">🔧</button>
                    <button onclick="toggleView('wishlist')" title="Wishlist Vault" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-indigo-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Archive" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                <div id="activeSessionBox" class="lg:col-span-5 bg-indigo-950/20 p-6 rounded-[2.5rem] border border-indigo-500/20 shadow-inner">
                    <h2 class="text-indigo-400 font-black text-sm uppercase tracking-widest mb-5 flex items-center gap-3 italic justify-center text-center text-white">Active Session</h2>
                    <div id="col-playing" class="space-y-5"></div>
                </div>
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl relative">
                    <div class="flex flex-col gap-4 relative">
                        <div class="text-[10px] font-black text-indigo-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">Database Search / Entry</span>
                            <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-red-400">Cancel Edit</button>
                        </div>
                        <input id="titleInput" type="text" oninput="searchGames(this.value)" placeholder="Search for game title..." class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 text-white text-base">
                        <div id="searchResults" class="hidden absolute top-[110px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[400px] z-50 text-white"></div>
                        <div class="flex flex-wrap justify-center gap-3 py-2 border-y border-slate-700/40">
                            <div onclick="toggleP('steam')" id="i-steam" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg"></div>
                            <div onclick="toggleP('gog')" id="i-gog" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/GOG.com_logo.svg"></div>
                            <div onclick="toggleP('epic')" id="i-epic" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Epic_Games_logo.svg"></div>
                            <div onclick="toggleP('battlenet')" id="i-battlenet" class="plat-box"><span style="color:#009eff; font-size: 16px;">BN</span></div>
                            <div onclick="toggleP('ps5')" id="i-ps5" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg"></div>
                            <div onclick="toggleP('xbox')" id="i-xbox" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg"></div>
                            <div onclick="toggleP('switch')" id="i-switch" class="plat-box"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Nintendo_Switch_Logo.svg"></div>
                            <div onclick="toggleP('amazon')" id="i-amazon" class="plat-box"><span style="color:#ff9900; font-size: 20px;">A</span></div>
                        </div>
                        <div class="flex gap-3 text-white relative">
                            <div class="flex-1 relative">
                                <input id="seriesInput" type="text" oninput="filterSeriesDropdown(this.value)" onfocus="filterSeriesDropdown(this.value)" placeholder="Chain Series Name" class="w-full bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold italic">
                                <div id="seriesResults" class="hidden absolute left-0 right-0 bottom-full mb-2 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[200px] z-50 text-white"></div>
                            </div>
                            <button onclick="submitForm()" id="submitBtn" class="bg-indigo-600 px-12 rounded-2xl font-black uppercase text-sm text-white hover:bg-indigo-500">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="queueView">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-slate-400 font-black text-sm uppercase tracking-[0.4em]">Next Focus</h2>
                            <input id="filterNext" type="text" oninput="render()" placeholder="Filter..." class="col-filter">
                        </div>
                        <div id="col-next" class="column-height space-y-5"></div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-slate-500 font-black text-sm uppercase tracking-[0.4em]">Backlog & Collection</h2>
                            <input id="filterBacklog" type="text" oninput="render()" placeholder="Filter..." class="col-filter">
                        </div>
                        <div id="col-backlog" class="column-height space-y-5 text-left"></div>
                    </div>
                </div>
            </div>

            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-10">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-white text-center">Archive</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter games..." class="col-filter">
                </div>
                <div id="col-alt" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
            </div>

            <div id="wishlistView" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-indigo-400 font-black text-3xl uppercase tracking-widest italic">The Wishlist Vault</h2>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-indigo-400 font-black text-sm uppercase tracking-[0.3em]">Released</h2>
                            <input id="filterWishlistReleased" type="text" oninput="render()" placeholder="Filter released..." class="col-filter">
                        </div>
                        <div id="col-wishlist-released" class="column-height space-y-5"></div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-amber-400 font-black text-sm uppercase tracking-[0.3em]">Upcoming</h2>
                            <input id="filterWishlistUpcoming" type="text" oninput="render()" placeholder="Filter upcoming..." class="col-filter">
                        </div>
                        <div id="col-wishlist-upcoming" class="column-height space-y-5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';

        let allGames = [], editingId = null, currentViewMode = 'queue', selectedPlatforms = [];

        const PLAT_MAP = { steam: {n:'Steam', c:'#171a21'}, gog: {n:'GOG', c:'#86328a'}, epic: {n:'Epic Games', c:'#313131'}, battlenet: {n:'BattleNet', c:'#009eff'}, ps5: {n:'PS5', c:'#003087'}, xbox: {n:'Xbox', c:'#107c10'}, switch: {n:'Nintendo Switch', c:'#e60012'}, amazon: {n:'Amazon Luna', c:'#ff9900'} };

        document.addEventListener('DOMContentLoaded', () => {
            initSortable(); 
            loadGames();
        });

        async function loadGames() { 
            let { data, error } = await supabaseClient.from('games').select('*').order('sort_order', { ascending: true }); 
            if (!error) { 
                allGames = data || []; 
                render(); 
            } 
        }

        function toggleP(p) { 
            if (selectedPlatforms.includes(p)) selectedPlatforms = selectedPlatforms.filter(x => x !== p); 
            else selectedPlatforms.push(p); 
            document.getElementById(`i-${p}`).classList.toggle('active'); 
        }

        function parseReleaseDate(val) {
            if (val === undefined || val === null || val === 'null' || val === 'undefined' || val === '') return null;
            let num = Number(val);
            if (isNaN(num) || num <= 0) return null;
            if (num > 32503680000) num = Math.floor(num / 1000);
            return num;
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const sIn = document.getElementById('seriesInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const genre = tIn.dataset.genre || '';
                const releaseDate = parseReleaseDate(tIn.dataset.release);
                const series = sIn.value.trim() || null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'Backlog';

                if (editingId) {
                    const cur = allGames.find(g => g.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(), 
                        series, 
                        platform: selectedPlatforms.join(','), 
                        cover_url: cover || cur.cover_url, 
                        genre: genre || cur.genre,
                        release_date: releaseDate !== null ? releaseDate : cur.release_date
                    };
                    
                    if (series && series !== cur.series) { 
                        const buddies = allGames.filter(g => g.series === series); 
                        if (buddies.length > 0) payload.sort_order = Math.max(...buddies.map(g => g.sort_order)) + 1; 
                    }
                    
                    const { error } = await supabaseClient.from('games').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    let next = allGames.length > 0 ? Math.max(...allGames.map(g => g.sort_order)) + 100 : 100;
                    if (series) { 
                        const buddies = allGames.filter(g => g.series === series); 
                        if (buddies.length > 0) next = Math.max(...buddies.map(g => g.sort_order)) + 1; 
                    }
                    
                    const { error } = await supabaseClient.from('games').insert([{ 
                        title: tIn.value.trim(), 
                        platform: selectedPlatforms.join(','), 
                        series, 
                        cover_url: cover, 
                        genre: genre || 'Action', 
                        release_date: releaseDate, 
                        status: defaultStatus, 
                        sort_order: next 
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadGames();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving game: ${err.message || 'Check database columns'}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 
            delete tIn.dataset.genre; 
            delete tIn.dataset.release; 

            document.getElementById('seriesInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('seriesResults').classList.add('hidden');
            document.getElementById('seriesResults').innerHTML = '';

            selectedPlatforms = []; 
            document.querySelectorAll('.plat-box').forEach(el => el.classList.remove('active')); 
            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "Database Search / Entry"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
        }

        function render() {
            const fN = document.getElementById('filterNext').value.toLowerCase();
            const fB = document.getElementById('filterBacklog').value.toLowerCase();
            const fA = document.getElementById('filterAlt').value.toLowerCase();
            const fWR = document.getElementById('filterWishlistReleased').value.toLowerCase();
            const fWU = document.getElementById('filterWishlistUpcoming').value.toLowerCase();

            const cols = { 
                playing: document.getElementById('col-playing'), 
                next: document.getElementById('col-next'), 
                backlog: document.getElementById('col-backlog'), 
                alt: document.getElementById('col-alt'), 
                wishlistReleased: document.getElementById('col-wishlist-released'),
                wishlistUpcoming: document.getElementById('col-wishlist-upcoming')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });
            
            const nextPri = { 'Up Next': 0, 'Started': 1 };
            const nowSec = Math.floor(Date.now() / 1000);

            if (currentViewMode === 'queue') {
                allGames.filter(g => g.status === 'Playing').forEach(g => cols.playing.appendChild(createCard(g)));
                
                allGames.filter(g => ['Up Next', 'Started'].includes(g.status))
                    .filter(g => g.title.toLowerCase().includes(fN) || (g.series && g.series.toLowerCase().includes(fN)))
                    .sort((a,b) => nextPri[a.status] - nextPri[b.status] || a.sort_order - b.sort_order)
                    .forEach(g => cols.next.appendChild(createCard(g)));

                allGames.filter(g => ['Backlog', 'Game Pass', 'PS Plus', 'Switch Online', 'Downloaded'].includes(g.status))
                    .filter(g => g.title.toLowerCase().includes(fB) || (g.series && g.series.toLowerCase().includes(fB)))
                    .forEach(g => cols.backlog.appendChild(createCard(g)));
            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Finished' : 'Not Interested';
                allGames.filter(g => g.status === target)
                    .filter(g => g.title.toLowerCase().includes(fA) || (g.series && g.series.toLowerCase().includes(fA)))
                    .forEach(g => cols.alt.appendChild(createCard(g)));
            } else if (currentViewMode === 'wishlist') {
                const wishlistGames = allGames.filter(g => g.status === 'Wishlist');

                const sortByReleaseDate = (a, b) => {
                    const dA = parseReleaseDate(a.release_date);
                    const dB = parseReleaseDate(b.release_date);
                    if (dA === null && dB === null) return 0;
                    if (dA === null) return 1;
                    if (dB === null) return -1;
                    return dA - dB;
                };

                wishlistGames.filter(g => {
                    const rDate = parseReleaseDate(g.release_date);
                    return rDate !== null && rDate <= nowSec;
                })
                .filter(g => g.title.toLowerCase().includes(fWR) || (g.series && g.series.toLowerCase().includes(fWR)))
                .sort(sortByReleaseDate)
                .forEach(g => cols.wishlistReleased.appendChild(createCard(g)));

                wishlistGames.filter(g => {
                    const rDate = parseReleaseDate(g.release_date);
                    return rDate === null || rDate > nowSec;
                })
                .filter(g => g.title.toLowerCase().includes(fWU) || (g.series && g.series.toLowerCase().includes(fWU)))
                .sort(sortByReleaseDate)
                .forEach(g => cols.wishlistUpcoming.appendChild(createCard(g)));
            }
        }

        function createCard(game) {
            const isS = game.series && game.series.trim() !== '';
            const nowSec = Math.floor(Date.now() / 1000);
            
            const rDate = parseReleaseDate(game.release_date);
            const isUnreleased = game.status === 'Wishlist' && (!rDate || rDate > nowSec);
            const releaseYear = rDate ? new Date(rDate * 1000).getFullYear() : 'TBA';
            
            const div = document.createElement('div');
            div.dataset.id = game.id; 
            div.dataset.series = game.series || '';
            div.className = `game-card border border-slate-700 shadow-xl relative mb-4 ${isS ? 'series-chained' : ''} ${isUnreleased ? 'unreleased-card' : ''}`;
            
            const platB = (game.platform || '').split(',').map(p => { 
                const i = PLAT_MAP[p.trim()]; 
                return i ? `<span class="plat-badge shadow-sm" style="background:${i.c}">${i.n}</span>` : ''; 
            }).join(' ');

            div.innerHTML = `
                <img loading="lazy" src="${game.cover_url || ''}" class="game-card-cover border-r border-slate-700 shadow-inner">
                <div class="p-4 flex-1 flex flex-col justify-between overflow-hidden text-white">
                    <div class="flex justify-between items-start text-white">
                        <div class="text-left flex-1 min-w-0 pr-2">
                            <h3 class="font-black text-[18px] leading-tight text-white clamp-2">${game.title}</h3>
                            <div class="flex flex-wrap gap-1.5 mt-3">${platB}</div>
                        </div>
                        <div class="icon-square shrink-0 text-white">
                            <button onclick='editP(${JSON.stringify(game).replace(/'/g, "&apos;")})' class="bg-slate-800 rounded-lg flex items-center justify-center text-lg hover:bg-slate-700 transition">🎮</button>
                            <button onclick='editL(${JSON.stringify(game).replace(/'/g, "&apos;")})' class="bg-slate-800 rounded-lg flex items-center justify-center text-lg hover:bg-slate-700 transition">🔍</button>
                            <button onclick='editS(${JSON.stringify(game).replace(/'/g, "&apos;")})' class="bg-slate-800 rounded-lg flex items-center justify-center text-lg hover:bg-slate-700 transition">🔗</button>
                            <button onclick="deleteGame('${game.id}')" class="bg-slate-800 rounded-lg flex items-center justify-center text-lg hover:bg-rose-900 transition">✕</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="flex flex-col min-w-0 pr-2 text-left">
                            ${isS ? `<span class="series-label truncate">Series: ${game.series}</span>` : ''}
                            <span class="genre-label truncate">${game.genre || 'Game'} • ${releaseYear}</span>
                        </div>
                        <select onchange="updateStatus('${game.id}', this.value)" class="bg-slate-900 text-xs py-2 px-4 rounded-xl border border-slate-700 text-white font-black uppercase outline-none cursor-pointer">
                            <option value="Backlog" ${game.status === 'Backlog' ? 'selected' : ''}>Backlog</option>
                            <option value="Wishlist" ${game.status === 'Wishlist' ? 'selected' : ''}>Wishlist</option>
                            <option value="Game Pass" ${game.status === 'Game Pass' ? 'selected' : ''}>Game Pass</option>
                            <option value="PS Plus" ${game.status === 'PS Plus' ? 'selected' : ''}>PS Plus</option>
                            <option value="Switch Online" ${game.status === 'Switch Online' ? 'selected' : ''}>Switch Online</option>
                            <option value="Downloaded" ${game.status === 'Downloaded' ? 'selected' : ''}>Downloaded</option>
                            <option value="Playing" ${game.status === 'Playing' ? 'selected' : ''}>Playing</option>
                            <option value="Up Next" ${game.status === 'Up Next' ? 'selected' : ''}>Up Next</option>
                            <option value="Started" ${game.status === 'Started' ? 'selected' : ''}>Started</option>
                            <option value="Finished" ${game.status === 'Finished' ? 'selected' : ''}>Finished</option>
                            <option value="Not Interested" ${game.status === 'Not Interested' ? 'selected' : ''}>Trash</option>
                        </select>
                    </div>
                </div>`;
            return div;
        }

        function toggleView(v) { 
            currentViewMode = v;
            const qv = document.getElementById('queueView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'queue') {
                dt.style.display = 'grid'; qv.style.display = 'block'; as.style.display = 'block'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                qv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; qv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Archive' : 'The Scrap Yard';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editL(g) { 
            editingId = g.id; 
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            dt.style.display = 'grid';
            
            if (currentViewMode !== 'queue') {
                as.style.display = 'none';
                ia.classList.remove('lg:col-span-7');
                ia.classList.add('lg:col-span-12');
            }

            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = g.title; 
            if (g.cover_url) tIn.dataset.img = g.cover_url;
            if (g.genre) tIn.dataset.genre = g.genre;
            if (g.release_date !== null && g.release_date !== undefined) tIn.dataset.release = g.release_date;

            document.getElementById('formModeLabel').innerText = "Updating: " + g.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
            
            selectedPlatforms = (g.platform || '').split(',').filter(x => x.trim()).map(x => x.trim()); 
            document.querySelectorAll('.plat-box').forEach(el => { 
                el.classList.toggle('active', selectedPlatforms.includes(el.id.replace('i-', ''))); 
            }); 
            
            document.getElementById('seriesInput').value = g.series || ''; 
            searchGames(g.title); 
        }

        function editP(g) { editL(g); }
        function editS(g) { editL(g); document.getElementById('seriesInput').focus(); }
        function exitEditMode() { resetForm(); toggleView(currentViewMode); }
        
        async function repairSortOrder() { 
            const b = document.getElementById('repairBtn'); 
            b.innerText = "⏳";
            
            try {
                const missingDates = allGames.filter(g => g.release_date === null || g.release_date === undefined);
                
                if (missingDates.length > 0) {
                    b.innerText = `⏳ (0/${missingDates.length})`;
                    let count = 0;

                    for (let g of missingDates) {
                        try {
                            const response = await fetch(`${SB_URL}/functions/v1/igdb-search`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'apikey': SB_KEY
                                },
                                body: JSON.stringify({ query: g.title })
                            });

                            const results = await response.json();

                            if (results && results.length > 0) {
                                const match = results.find(r => r.name.toLowerCase() === g.title.toLowerCase()) || results[0];
                                const fetchedDate = parseReleaseDate(match.first_release_date);

                                if (fetchedDate) {
                                    await supabaseClient
                                        .from('games')
                                        .update({ release_date: fetchedDate })
                                        .eq('id', g.id);
                                }
                            }
                        } catch (err) {
                            console.error(`Failed to fetch release date for ${g.title}:`, err);
                        }

                        count++;
                        b.innerText = `⏳ (${count}/${missingDates.length})`;
                        await new Promise(res => setTimeout(res, 200));
                    }
                }

                let list = [...allGames].sort((a,b) => a.sort_order - b.sort_order);
                let finalOrder = []; 
                let processedSeries = new Set();

                for (let g of list) {
                    if (processedSeries.has(g.series)) continue;
                    if (g.series) {
                        let buddies = list.filter(item => item.series === g.series);
                        finalOrder.push(...buddies); 
                        processedSeries.add(g.series);
                    } else { 
                        finalOrder.push(g); 
                    }
                }

                for (let i = 0; i < finalOrder.length; i++) { 
                    await supabaseClient
                        .from('games')
                        .update({ sort_order: (i + 1) * 100 })
                        .eq('id', finalOrder[i].id); 
                }

                alert("Vault rebuild complete: Release dates filled and sorting resynced!");

            } catch (err) {
                console.error("Rebuild failed:", err);
                alert(`Rebuild error: ${err.message}`);
            } finally {
                b.innerText = "🔧"; 
                loadGames(); 
            }
        }

        async function updateStatus(id, s) { await supabaseClient.from('games').update({ status:s }).eq('id', id); loadGames(); }
        
        function initSortable() { 
            ['col-playing', 'col-next', 'col-backlog'].forEach(id => { 
                const el = document.getElementById(id);
                if (!el) return;
                new Sortable(el, { 
                    group: 'games', 
                    animation: 250, 
                    onEnd: async (evt) => { 
                        let targetS = 'Backlog'; 
                        if(evt.to.id === 'col-playing') targetS = 'Playing'; 
                        else if(evt.to.id === 'col-next') targetS = 'Up Next'; 
                        const items = Array.from(evt.to.children); 
                        for(let i=0; i<items.length; i++) {
                            await supabaseClient.from('games').update({ sort_order: (i + 1) * 100, status: targetS }).eq('id', items[i].dataset.id); 
                        }
                        loadGames(); 
                    } 
                }); 
            }); 
        }

        async function deleteGame(id) { if(confirm('Delete?')) { await supabaseClient.from('games').delete().eq('id', id); loadGames(); } }
        
        function filterSeriesDropdown(val) {
            const sr = document.getElementById('seriesResults');
            const existingSeries = Array.from(new Set(allGames.map(g => g.series).filter(s => s && s.trim() !== '')));
            const filtered = existingSeries.filter(s => s.toLowerCase().includes(val.toLowerCase().trim()));

            if (filtered.length === 0) {
                sr.classList.add('hidden');
                return;
            }

            sr.innerHTML = filtered.map(s => {
                const safeName = s.replace(/"/g, '&quot;');
                return `<div onclick="selectSeries(&quot;${safeName}&quot;)" class="p-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700/60 text-left text-white font-bold text-xs truncate transition-colors">${s}</div>`;
            }).join('');

            sr.classList.remove('hidden');
        }

        function selectSeries(name) {
            document.getElementById('seriesInput').value = name;
            document.getElementById('seriesResults').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#seriesInput') && !e.target.closest('#seriesResults')) {
                document.getElementById('seriesResults').classList.add('hidden');
            }
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });

        async function searchGames(q) { 
            const r = document.getElementById('searchResults'); 
            const trimmedQuery = q ? q.trim() : '';

            if (trimmedQuery.length < 2) { 
                r.classList.add('hidden'); 
                r.innerHTML = '';
                return; 
            } 

            try {
                const response = await fetch(`${SB_URL}/functions/v1/igdb-search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SB_KEY
                    },
                    body: JSON.stringify({ query: trimmedQuery })
                });

                const results = await response.json();

                if (results.error) {
                    r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Error: ${results.error}</div>`;
                    r.classList.remove('hidden');
                    return;
                }

                if (!results || results.length === 0) {
                    r.innerHTML = `<div class="p-4 text-sm text-slate-400">No results found.</div>`;
                    r.classList.remove('hidden');
                    return;
                }

                r.innerHTML = results.map(g => {
                    const title = (g.name || '').replace(/"/g, '&quot;');
                    const cover = g.cover?.image_id ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${g.cover.image_id}.jpg` : '';
                    const genre = (g.genres && g.genres[0]) ? (g.genres[0].name).replace(/"/g, '&quot;') : 'Game';
                    const release = g.first_release_date !== undefined ? g.first_release_date : '';
                    const yearLabel = release ? new Date(release * 1000).getFullYear() : 'TBA';
                    
                    return `
                        <div onclick="selectGame(&quot;${title}&quot;, &quot;${cover}&quot;, &quot;${genre}&quot;, &quot;${release}&quot;)" 
                             class="p-4 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors">
                            ${cover ? `<img src="${cover}" class="w-12 h-16 object-cover rounded shadow bg-slate-900">` : '<div class="w-12 h-16 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'}
                            <div>
                                <p class="text-sm font-bold text-white">${g.name}</p>
                                <p class="text-xs text-slate-400 font-normal uppercase mt-0.5">${genre} • ${yearLabel}</p>
                            </div>
                        </div>
                    `;
                }).join(''); 
                
                r.classList.remove('hidden');

            } catch (err) {
                r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Network error: ${err.message}</div>`;
                r.classList.remove('hidden');
            }
        }

        function selectGame(n, i, g, r) { 
            const tIn = document.getElementById('titleInput'); 
            tIn.value = n; 
            document.getElementById('searchResults').classList.add('hidden'); 
            
            if (i) tIn.dataset.img = i;
            if (g) tIn.dataset.genre = g;
            
            const parsedDate = parseReleaseDate(r);
            if (parsedDate !== null) {
                tIn.dataset.release = parsedDate;
            } else {
                delete tIn.dataset.release;
            }
            
            document.getElementById('seriesInput').focus();
        }

        function downloadTemplate() { 
            const csv = "title,platform,series,genre,status,cover_url\nElden Ring,steam,,RPG,Backlog,https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg"; 
            const blob = new Blob([csv], { type: 'text/csv' }); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = 'vault_template.csv'; 
            a.click(); 
        }

        document.getElementById('csvFile').addEventListener('change', function(e) { 
            const r = new FileReader(); 
            r.onload = async (ev) => { 
                const rows = ev.target.result.split('\n').slice(1); 
                const gToInsert = rows.map(r => { 
                    const cols = r.split(',').map(x => x?.trim()); 
                    if (cols[0]) return { title: cols[0], platform: cols[1]||'PC', series: cols[2]||null, genre: cols[3]||'Action', status: cols[4]||'Backlog', cover_url: cols[5]||'', sort_order: 100 }; 
                }).filter(x => x); 
                await supabaseClient.from('games').insert(gToInsert); 
                loadGames(); 
            }; 
            r.readAsText(e.target.files[0]); 
        });
    </script>
</body>
