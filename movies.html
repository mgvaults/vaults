<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
        .media-card { background-color: #1e293b; border-radius: 1rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .media-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .media-card img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background-color: #0f172a; }
        .upcoming-card img { filter: grayscale(1) opacity(0.5); }
        #authScreen { background-color: #0b0f19; position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .col-filter { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 99px; padding: 4px 16px; font-size: 11px; outline: none; width: 180px; color: white; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">

    <div id="authScreen">
        <div class="bg-slate-800 p-10 rounded-[3rem] border border-slate-700 shadow-2xl w-full max-w-sm text-center">
            <div class="mb-2 text-indigo-400 text-6xl font-black italic tracking-tighter uppercase leading-none text-white">Vault</div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-8">Cinema Portal Authentication</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 px-6 rounded-2xl font-black hover:bg-slate-100 transition flex items-center justify-center gap-3 uppercase tracking-wider text-sm shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-6 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <button onclick="window.location.href='index.html'" title="Home" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🏠</button>
                   <button onclick="window.location.href='games.html'" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</button>
                   <button onclick="window.location.href='books.html'" title="Books Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📚</button>
                   <button onclick="toggleView('queue')" id="btn-queue" title="Movies Vault" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg">🎬</button>
                   <button onclick="logout()" title="Sign Out" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 id="pageHeaderTitle" class="text-3xl font-black tracking-tighter text-indigo-500 uppercase italic">Movies Vault</h1>
                <div class="flex items-center gap-2">
                    <button onclick="sortAlphabetically()" title="Rebuild & Sort A-Z" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-sky-600 transition">🔤</button>
                    <div class="relative group">
                        <button class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="hidden group-hover:flex flex-col gap-2 absolute left-0 top-full mt-2 p-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50">
                            <button onclick="downloadTemplate()" title="CSV Template" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('archive')" id="btn-archive" title="Trophy Room (Watched)" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
                
                <div class="lg:col-span-5 bg-slate-900/60 border border-slate-800/80 rounded-[2rem] p-6 flex flex-col justify-between min-h-[220px]">
                    <div class="text-xs font-black italic uppercase tracking-wider text-indigo-400 mb-3">CURRENTLY WATCHING</div>
                    <div id="activeSessionContainer" class="flex-1 flex items-center justify-center">
                        <p class="text-slate-500 text-sm font-semibold italic">No active view</p>
                    </div>
                </div>

                <div class="lg:col-span-7 bg-slate-900/60 border border-slate-800/80 rounded-[2rem] p-6 flex flex-col gap-4">
                    <div class="text-[11px] font-black italic uppercase tracking-widest text-indigo-400">DATABASE SEARCH / ENTRY</div>
                    
                    <div class="relative">
                        <input id="apiSearchInput" type="text" placeholder="Search for movie or TV show title..." onkeypress="if(event.key==='Enter') searchTmdb()" class="w-full bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
                        <button onclick="searchTmdb()" class="absolute right-3 top-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs px-4 py-2 rounded-xl transition">SEARCH API</button>
                    </div>

                    <div id="searchResultsDropdown" class="hidden max-h-48 overflow-y-auto bg-[#0b0f19] border border-slate-800 rounded-xl p-2 flex flex-col gap-2"></div>

                    <div class="flex gap-3 mt-1">
                        <input id="manualGenre" type="text" placeholder="Release Year / Genre" class="flex-1 bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
                        <input id="manualSeries" type="text" placeholder="Series / Collection (Optional)" class="flex-1 bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
                        <button onclick="commitManualMovie()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs tracking-widest px-8 rounded-2xl transition shadow-lg">COMMIT</button>
                    </div>
                </div>

            </div>

            <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-800/60 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
                <input id="movieSearch" type="text" oninput="render()" placeholder="Filter library by title..." class="w-full sm:w-2/3 bg-[#0b0f19] p-3 rounded-xl border border-slate-800 text-white text-xs outline-none">
                <input id="filterGenre" type="text" oninput="render()" placeholder="Filter genre..." class="col-filter py-2 w-full sm:w-auto">
            </div>

            <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const TMDB_API_KEY = 'cc8704bb1bd344f8aaa7309acb9c3e1f';

        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let allMovies = [];
        let newlyAddedId = null;
        let currentView = 'queue';
        const CURRENT_YEAR = new Date().getFullYear();

        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(); else showAuth();
            supabaseClient.auth.onAuthStateChange((_e, s) => { if (s) showApp(); else showAuth(); });
        }

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
            if (error) alert(error.message);
        }

        async function logout() { await supabaseClient.auth.signOut(); showAuth(); }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadMovies();
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        async function loadMovies() {
            let { data, error } = await supabaseClient.from('movies').select('*');
            if (!error) { 
                allMovies = data || []; 
                render(); 
                updateActiveSession(); 
            }
        }

        function sortAlphabetically() {
            allMovies.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            newlyAddedId = null;
            render();
        }

        function updateActiveSession() {
            const activeContainer = document.getElementById('activeSessionContainer');
            const activeMovie = allMovies.find(m => m.status === 'Watching');

            if (activeMovie) {
                activeContainer.innerHTML = `
                    <div class="flex items-center gap-4 w-full">
                        <img src="${activeMovie.cover_url || 'https://via.placeholder.com/150x225?text=No+Poster'}" class="w-16 h-24 object-cover rounded-xl border border-slate-700">
                        <div>
                            <h4 class="font-black text-white text-base leading-tight">${activeMovie.title}</h4>
                            <p class="text-xs text-slate-400 mt-1">${activeMovie.release_year || 'N/A'}</p>
                            ${activeMovie.series ? `<div class="mt-1"><span class="inline-block text-[9px] bg-orange-600/20 text-orange-400 border border-orange-500/30 px-1.5 py-0.5 rounded font-bold uppercase truncate max-w-[150px]">⚡ ${activeMovie.series}</span></div>` : ''}
                            <span class="inline-block mt-2 text-[10px] bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 px-2 py-0.5 rounded-md font-bold uppercase block w-fit">${activeMovie.genre || 'Movie'}</span>
                        </div>
                    </div>
                `;
            } else {
                activeContainer.innerHTML = `<p class="text-slate-500 text-sm font-semibold italic">No active view</p>`;
            }
        }

        function toggleView(mode) {
            currentView = mode;
            const btnQ = document.getElementById('btn-queue');
            const btnA = document.getElementById('btn-archive');
            const title = document.getElementById('pageHeaderTitle');

            if (mode === 'archive') {
                btnA.className = "bg-emerald-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg";
                btnQ.className = "bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700";
                title.innerText = "Movies Trophy Room";
                title.className = "text-3xl font-black tracking-tighter text-emerald-400 uppercase italic";
            } else {
                btnQ.className = "bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg";
                btnA.className = "bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600";
                title.innerText = "Movies Vault";
                title.className = "text-3xl font-black tracking-tighter text-indigo-500 uppercase italic";
            }
            render();
        }

        async function updateStatus(id, newStatus) {
            await supabaseClient.from('movies').update({ status: newStatus }).eq('id', id);
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm("Are you sure you want to delete this title?")) {
                await supabaseClient.from('movies').delete().eq('id', id);
                loadMovies();
            }
        }

        function render() {
            const query = document.getElementById('movieSearch').value.toLowerCase();
            const genre = document.getElementById('filterGenre').value.toLowerCase();
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            let listToRender = [...allMovies];
            
            // If newly added item exists, move it to index 0
            if (newlyAddedId) {
                const recentIdx = listToRender.findIndex(m => m.id === newlyAddedId);
                if (recentIdx > -1) {
                    const [recentItem] = listToRender.splice(recentIdx, 1);
                    listToRender.unshift(recentItem);
                }
            }

            listToRender
                .filter(m => {
                    const isWatched = m.status === 'Watched';
                    return currentView === 'archive' ? isWatched : !isWatched;
                })
                .filter(m => (m.title || '').toLowerCase().includes(query) || (m.series || '').toLowerCase().includes(query))
                .filter(m => (m.genre || '').toLowerCase().includes(genre))
                .forEach(movie => {
                    const yearNum = parseInt(movie.release_year);
                    const isUpcomingYear = !isNaN(yearNum) && yearNum > CURRENT_YEAR;
                    const isReturningSeries = movie.is_returning_series;
                    const hasSeries = Boolean(movie.series);
                    
                    const card = document.createElement('div');
                    card.className = `media-card p-3 flex flex-col justify-between ${isUpcomingYear ? 'upcoming-card border-slate-700/50 border-dashed' : ''}`;
                    
                    card.innerHTML = `
                        <div class="h-1.5 w-full rounded-t-lg -mt-3 -mx-3 mb-2 ${hasSeries ? 'bg-orange-500' : 'bg-sky-400'}"></div>
                        
                        <div>
                            <div class="relative">
                                <img src="${movie.cover_url || 'https://via.placeholder.com/150x225?text=No+Poster'}" alt="${movie.title}">
                                ${isUpcomingYear ? `<span class="absolute top-2 right-2 bg-purple-900/90 text-purple-200 border border-purple-400/50 text-[9px] font-black px-1.5 py-0.5 rounded shadow">UPCOMING</span>` : ''}
                                ${isReturningSeries && !isUpcomingYear ? `<span class="absolute top-2 right-2 bg-cyan-900/90 text-cyan-200 border border-cyan-400/50 text-[9px] font-black px-1.5 py-0.5 rounded shadow">📺 Season TBA</span>` : ''}
                            </div>
                            
                            <div class="flex justify-between items-start gap-2 mt-3">
                                <h3 class="font-bold text-sm text-white leading-snug line-clamp-2">${movie.title}</h3>
                                <button onclick="deleteMovie(${movie.id})" title="Delete Title" class="text-slate-500 hover:text-red-400 font-bold text-base leading-none p-1 transition">✕</button>
                            </div>

                            <p class="text-xs text-slate-400 mt-1">${movie.release_year || 'N/A'}</p>
                            ${hasSeries ? `<div class="mt-1"><span class="inline-block text-[9px] bg-orange-600/20 text-orange-400 border border-orange-500/30 px-1.5 py-0.5 rounded font-bold uppercase truncate max-w-full">⚡ ${movie.series}</span></div>` : ''}
                        </div>

                        <div class="mt-3 flex flex-col gap-1.5 text-xs border-t border-slate-800/80 pt-2">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-indigo-400 font-bold uppercase text-[10px] truncate max-w-[80px]">${movie.genre || 'Movie'}</span>
                                <select onchange="updateStatus(${movie.id}, this.value)" class="bg-slate-900 text-[11px] py-1 px-1 rounded border border-slate-700 text-white font-bold outline-none cursor-pointer w-auto max-w-[110px]">
                                    <option value="Archives" ${movie.status !== 'Watching' && movie.status !== 'Watched' && movie.status !== 'Upcoming Season' ? 'selected' : ''}>Archives</option>
                                    <option value="Watching" ${movie.status === 'Watching' ? 'selected' : ''}>Watching</option>
                                    <option value="Upcoming Season" ${movie.status === 'Upcoming Season' ? 'selected' : ''}>Upcoming ⏳</option>
                                    <option value="Watched" ${movie.status === 'Watched' ? 'selected' : ''}>Watched 🏆</option>
                                </select>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
        }

        async function searchTmdb() {
            const query = document.getElementById('apiSearchInput').value;
            if (!query) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
            const data = await res.json();
            const dropdown = document.getElementById('searchResultsDropdown');
            dropdown.innerHTML = '';

            if (data.results) {
                dropdown.classList.remove('hidden');
                data.results.forEach(item => {
                    if (item.media_type !== 'movie' && item.media_type !== 'tv') return;

                    const title = item.title || item.name || 'Untitled';
                    const date = item.release_date || item.first_air_date || '';
                    const year = date ? date.split('-')[0] : 'N/A';
                    const cover = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                    const genre = item.media_type === 'tv' ? 'TV Show' : 'Movie';

                    const el = document.createElement('div');
                    el.className = 'flex items-center justify-between bg-slate-800/80 p-2 rounded-xl border border-slate-700/50 hover:border-indigo-500 cursor-pointer';
                    el.onclick = () => fetchDetailsAndAdd(item.id, item.media_type, title, year, genre, cover);
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${cover || 'https://via.placeholder.com/150x225?text=No+Poster'}" class="w-8 h-10 object-cover rounded">
                            <div>
                                <h5 class="text-xs font-bold text-white leading-tight">${title}</h5>
                                <p class="text-[10px] text-slate-400">${year} • ${genre}</p>
                            </div>
                        </div>
                        <span class="text-[10px] bg-indigo-600 px-2 py-1 rounded text-white font-bold uppercase">Add</span>
                    `;
                    dropdown.appendChild(el);
                });
            }
        }

        async function fetchDetailsAndAdd(id, mediaType, title, release_year, genre, cover_url) {
            let series = null;
            let is_returning_series = false;

            try {
                const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}?api_key=${TMDB_API_KEY}`);
                const detail = await res.json();
                
                if (mediaType === 'movie' && detail.belongs_to_collection) {
                    series = detail.belongs_to_collection.name.replace(/ Collection$/i, '');
                }
                if (mediaType === 'tv' && detail.status === 'Returning Series') {
                    is_returning_series = true;
                }
            } catch (e) {
                console.log("Could not fetch additional collection details", e);
            }

            await addMovieFromApi(title, release_year, genre, cover_url, series, is_returning_series);
        }

        async function addMovieFromApi(title, release_year, genre, cover_url, series, is_returning_series) {
            const { data } = await supabaseClient.from('movies').insert([{ 
                title, 
                release_year, 
                genre, 
                cover_url, 
                series, 
                is_returning_series,
                status: 'Archives' 
            }]).select();

            if (data && data[0]) {
                newlyAddedId = data[0].id;
            }

            document.getElementById('searchResultsDropdown').classList.add('hidden');
            document.getElementById('apiSearchInput').value = '';
            loadMovies();
        }

        async function commitManualMovie() {
            const title = document.getElementById('apiSearchInput').value;
            const genre = document.getElementById('manualGenre').value;
            const series = document.getElementById('manualSeries').value;
            if (!title) return alert('Please enter a title');

            const { data } = await supabaseClient.from('movies').insert([{ title, genre, series, status: 'Archives' }]).select();
            if (data && data[0]) {
                newlyAddedId = data[0].id;
            }

            document.getElementById('apiSearchInput').value = '';
            document.getElementById('manualGenre').value = '';
            document.getElementById('manualSeries').value = '';
            loadMovies();
        }

        function downloadTemplate() {
            const csv = "title,release_year,genre,series,status,cover_url\nInception,2010,Sci-Fi,,Watched,https://via.placeholder.com/150x225";
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'movies_template.csv'; a.click();
        }

        initAuth();
    </script>
</body>
</html>
