<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Collection</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .search-wrapper {
      position: relative;
      width: 300px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
    }

    .search-results-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      margin-top: 4px;
    }

    .search-item {
      padding: 0.6rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
    }

    .search-item:hover {
      background: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-body {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--accent-blue);
      align-self: flex-start;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .card h3 {
      font-size: 0.95rem;
      margin: 0 0 0.5rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .type-badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }

    .badge-movie {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #3b82f6;
    }

    .badge-tv {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 0.5rem;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .footer-type {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h2>VAULT COLLECTION</h2>
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Filter collection..." oninput="handleSearch(this.value)">
      <div id="searchResults" class="search-results-dropdown"></div>
    </div>
  </div>

  <div class="grid" id="movieGrid"></div>

  <script>
    const SB_URL = "YOUR_SUPABASE_URL";
    const SB_KEY = "YOUR_SUPABASE_ANON_KEY";

    let debounceTimer;

    function handleSearch(query) {
      clearTimeout(debounceTimer);
      if (!query.trim()) {
        document.getElementById('searchResults').style.display = 'none';
        return;
      }
      debounceTimer = setTimeout(() => searchMovies(query), 300);
    }

    async function searchMovies(query) {
      try {
        const res = await fetch(`${SB_URL}/functions/v1/tmdb-search`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SB_KEY}`,
            'apikey': SB_KEY
          },
          body: JSON.stringify({ query: query })
        });

        const data = await res.json();
        displaySearchResults(data.results || []);
      } catch (err) {
        console.error("Search failed with error:", err);
      }
    }

    function displaySearchResults(results) {
      const container = document.getElementById('searchResults');
      if (!container) return;

      if (!results || results.length === 0) {
        container.innerHTML = '<div class="search-item">No results found</div>';
        container.style.display = 'block';
        return;
      }

      container.innerHTML = results.map(item => {
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || '').split('-')[0];
        const mediaType = item.media_type === 'tv' ? 'SHOW' : 'MOVIE';

        return `
          <div class="search-item" onclick="selectMovie(${item.id}, '${item.media_type}')">
            <strong>${title}</strong> (${year || 'N/A'}) - <em>${mediaType}</em>
          </div>
        `;
      }).join('');

      container.style.display = 'block';
    }

    async function selectMovie(id, mediaType) {
      document.getElementById('searchResults').style.display = 'none';
      
      let seasons = 1;
      if (mediaType === 'tv') {
        try {
          const res = await fetch(`${SB_URL}/functions/v1/tmdb-search`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SB_KEY}`,
              'apikey': SB_KEY
            },
            body: JSON.stringify({ tvId: id })
          });
          const data = await res.json();
          seasons = data.number_of_seasons || 1;
        } catch (err) {
          console.error("Failed to fetch season details:", err);
        }
      }

      alert(`Selected ID: ${id} | Type: ${mediaType} | Seasons: ${seasons}`);
    }

    function renderCard(item) {
      const isTV = item.media_type === 'tv' || item.type === 'SHOW' || item.seasons > 0;
      
      let seasonLabel = '';
      if (isTV && item.seasons) {
        seasonLabel = item.seasons > 1 ? ` • ${item.seasons} Seasons` : ` • S${item.seasons}`;
      }

      return `
        <div class="card">
          <img src="${item.poster_url || 'https://via.placeholder.com/180x260'}" alt="${item.title}" />
          <div class="card-body">
            <span class="tag">${item.collection_name || 'STANDALONE'}</span>
            <h3>${item.title}</h3>
            
            <div class="meta-row">
              <span>${item.release_year || 'N/A'}</span>
              <span class="type-badge ${isTV ? 'badge-tv' : 'badge-movie'}">
                ${isTV ? `SHOW${seasonLabel}` : 'MOVIE'}
              </span>
            </div>

            <div class="card-footer">
              <span class="footer-type">${isTV ? 'SHOW' : 'MOVIE'}</span>
              <span>${item.status || 'Archive'}</span>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
