<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & TV Vault</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <script>
    window.tailwind = { config: { suppressDeprecationWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>

<body class="bg-slate-900 min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">
    <div id="mainApp">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <a href="dashboard.html" title="Home Dashboard" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg flex items-center justify-center hover:bg-indigo-500">🏠</a>
                   <a href="games.html" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</a>
                   <a href="books.html" title="Books Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📚</a>
                   <button onclick="handleLogout()" title="Lock Vault / Logout" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-sky-400 uppercase italic">Movies & TV Vault</h1>
                <div class="flex items-center gap-2">
                    <div class="toolbox-dropdown">
                        <button title="Toolbox" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="toolbox-menu">
                            <button id="repairBtn" onclick="repairSortOrder()" title="Repair Sort & Dates" class="toolbox-item-icon text-amber-400">🔧</button>
                            <button onclick="downloadTemplate()" title="Download CSV Template" class="toolbox-item-icon">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="toolbox-item-icon">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-sky-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Archive / Watched" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                <div id="activeSessionBox" class="lg:col-span-5 bg-sky-950/20 p-6 rounded-[2.5rem] border border-sky-500/20 shadow-inner">
                    <h2 class="text-sky-400 font-black text-sm uppercase tracking-widest mb-5 flex items-center gap-3 italic justify-center text-center text-white">Currently Watching</h2>
                    <div id="col-watching" class="flex flex-wrap gap-4 justify-center sm:justify-start"></div>
                </div>
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl relative">
                    <div class="flex flex-col gap-4 relative">
                        <div class="text-[10px] font-black text-sky-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">TMDB Search / Entry</span>
                            <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-red-400">Cancel Edit</button>
                        </div>
                        <input id="titleInput" type="text" oninput="searchMedia(this.value)" placeholder="Search Movie or TV Series..." class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 text-white text-base">
                        <div id="searchResults" class="hidden absolute top-[110px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[400px] z-50 text-white"></div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <select id="mediaTypeInput" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                                <option value="Movie">Movie 🎬</option>
                                <option value="TV Series">TV Series 📺</option>
                            </select>
                            <input id="genreInput" type="text" placeholder="Genre" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            <input id="yearInput" type="text" placeholder="Release Year" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                        </div>

                        <div class="flex gap-3 text-white relative">
                            <div class="flex-1 flex gap-2">
                                <input id="seriesInput" type="text" placeholder="Franchise / Universe (e.g., MCU, Star Wars)" class="w-full bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold italic">
                                <input id="seriesNumInput" type="number" step="0.1" placeholder="Part #" class="w-24 bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            </div>
                            <button onclick="submitForm()" id="submitBtn" class="bg-sky-600 px-10 rounded-2xl font-black uppercase text-sm text-white hover:bg-sky-500">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="queueView">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-slate-400 font-black text-sm uppercase tracking-[0.4em]">Watchlist & Library</h2>
                    <input id="filterQueue" type="text" oninput="render()" placeholder="Filter media..." class="col-filter">
                </div>
                <div id="col-queue" class="flex flex-wrap gap-4 min-h-[450px]"></div>
            </div>

            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-10">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-white text-center">Archive</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter..." class="col-filter">
                </div>
                <div id="col-alt" class="flex flex-wrap gap-4"></div>
            </div>

            <div id="wishlistView" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-sky-400 font-black text-3xl uppercase tracking-widest italic">Wishlist Vault</h2>
                </div>
                <div id="col-wishlist" class="flex flex-wrap gap-4 justify-center sm:justify-start"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const TMDB_KEY = 'cc8704bb1bd344f8aaa7309acb9c3e1f';

        let allMedia = [], editingId = null, currentViewMode = 'queue';

        document.addEventListener('DOMContentLoaded', () => {
            loadMedia();
        });

        async function loadMedia() { 
            let { data, error } = await supabaseClient.from('movies').select('*').order('sort_order', { ascending: true }); 
            if (!error) { 
                allMedia = data || []; 
                render(); 
            } 
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const mtIn = document.getElementById('mediaTypeInput');
            const gIn = document.getElementById('genreInput');
            const yIn = document.getElementById('yearInput');
            const sIn = document.getElementById('seriesInput');
            const snIn = document.getElementById('seriesNumInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const series = sIn.value.trim() || null;
                const seriesNum = snIn.value ? parseFloat(snIn.value) : null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'Plan to Watch';

                if (editingId) {
                    const cur = allMedia.find(m => m.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(),
                        media_type: mtIn.value,
                        genre: gIn.value.trim() || 'Entertainment',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover || cur.cover_url
                    };
                    
                    const { error } = await supabaseClient.from('movies').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    let next = allMedia.length > 0 ? Math.max(...allMedia.map(m => m.sort_order)) + 100 : 100;
                    const { error } = await supabaseClient.from('movies').insert([{ 
                        title: tIn.value.trim(), 
                        media_type: mtIn.value,
                        genre: gIn.value.trim() || 'Entertainment',
                        release_year: yIn.value.trim() || '',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover, 
                        status: defaultStatus, 
                        sort_order: next 
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadMedia();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving media item: ${err.message || 'Check database table standard'}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 

            document.getElementById('genreInput').value = '';
            document.getElementById('yearInput').value = '';
            document.getElementById('seriesInput').value = ''; 
            document.getElementById('seriesNumInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "TMDB Search / Entry"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
        }

        function render() {
            const fQ = document.getElementById('filterQueue').value.toLowerCase();
            const fA = document.getElementById('filterAlt').value.toLowerCase();

            const cols = { 
                watching: document.getElementById('col-watching'), 
                queue: document.getElementById('col-queue'), 
                alt: document.getElementById('col-alt'), 
                wishlist: document.getElementById('col-wishlist')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });

            if (currentViewMode === 'queue') {
                allMedia.filter(m => m.status === 'Watching').forEach(m => cols.watching.appendChild(createCard(m)));
                
                allMedia.filter(m => m.status === 'Plan to Watch')
                    .filter(m => m.title.toLowerCase().includes(fQ) || (m.series && m.series.toLowerCase().includes(fQ)))
                    .forEach(m => cols.queue.appendChild(createCard(m)));
            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Watched' : 'Not Interested';
                allMedia.filter(m => m.status === target)
                    .filter(m => m.title.toLowerCase().includes(fA) || (m.series && m.series.toLowerCase().includes(fA)))
                    .forEach(m => cols.alt.appendChild(createCard(m)));
            } else if (currentViewMode === 'wishlist') {
                allMedia.filter(m => m.status === 'Wishlist')
                    .forEach(m => cols.wishlist.appendChild(createCard(m)));
            }
        }

        function createCard(item) {
            const isS = item.series && item.series.trim() !== '';
            
            const div = document.createElement('div');
            div.dataset.id = item.id; 
            div.className = `poster-card ${isS ? 'series-chained' : ''}`;
            div.title = `${item.title} (${item.release_year || 'N/A'})`;

            div.innerHTML = `
                <img src="${item.cover_url || ''}" class="poster-cover" alt="${item.title}">
                
                ${item.series_num ? `<span class="series-badge-overlay">#${item.series_num}</span>` : ''}

                <!-- Vertical Action Icons Sidebar -->
                <div class="card-actions-sidebar">
                    <button title="Edit" onclick='editMedia(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="action-btn">✏️</button>
                    <button title="Watching" onclick="updateStatus('${item.id}', 'Watching')" class="action-btn ${item.status === 'Watching' ? 'active' : ''}">👁️</button>
                    <button title="Watched" onclick="updateStatus('${item.id}', 'Watched')" class="action-btn ${item.status === 'Watched' ? 'active' : ''}">🏆</button>
                    <button title="Wishlist Disabled" class="action-btn disabled" disabled>📋</button>
                    <button title="Delete" onclick="deleteMedia('${item.id}')" class="action-btn text-rose-400">✕</button>
                </div>`;
            return div;
        }

        function toggleView(v) { 
            currentViewMode = v;
            const qv = document.getElementById('queueView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'queue') {
                dt.style.display = 'grid'; qv.style.display = 'block'; as.style.display = 'block'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                qv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; qv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Watched Archive' : 'Scrap Yard';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editMedia(m) { 
            editingId = m.id; 
            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = m.title; 
            if (m.cover_url) tIn.dataset.img = m.cover_url;

            document.getElementById('mediaTypeInput').value = m.media_type || 'Movie';
            document.getElementById('genreInput').value = m.genre || '';
            document.getElementById('yearInput').value = m.release_year || '';
            document.getElementById('seriesInput').value = m.series || ''; 
            document.getElementById('seriesNumInput').value = m.series_num || ''; 

            document.getElementById('formModeLabel').innerText = "Updating: " + m.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
        }

        function exitEditMode() { resetForm(); toggleView(currentViewMode); }
        async function updateStatus(id, s) { await supabaseClient.from('movies').update({ status:s }).eq('id', id); loadMedia(); }
        async function deleteMedia(id) { if(confirm('Delete media?')) { await supabaseClient.from('movies').delete().eq('id', id); loadMedia(); } }

        async function searchMedia(q) { 
            const r = document.getElementById('searchResults'); 
            const trimmedQuery = q ? q.trim() : '';

            if (trimmedQuery.length < 2) { 
                r.classList.add('hidden'); 
                r.innerHTML = '';
                return; 
            } 

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(trimmedQuery)}`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    r.innerHTML = `<div class="p-4 text-sm text-slate-400">No results found.</div>`;
                    r.classList.remove('hidden');
                    return;
                }

                r.innerHTML = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv').map(item => {
                    const isTV = item.media_type === 'tv';
                    const title = (isTV ? item.name : item.title || '').replace(/"/g, '&quot;');
                    const dateStr = isTV ? item.first_air_date : item.release_date;
                    const year = dateStr ? dateStr.split('-')[0] : 'N/A';
                    const cover = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                    const mType = isTV ? 'TV Series' : 'Movie';
                    
                    return `
                        <div onclick="selectMedia(&quot;${title}&quot;, &quot;${mt}&quot;, &quot;${cover}&quot;, &quot;${year}&quot;)" 
                             class="p-4 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors">
                            ${cover ? `<img src="${cover}" class="w-12 h-16 object-cover rounded shadow bg-slate-900">` : '<div class="w-12 h-16 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'}
                            <div>
                                <p class="text-sm font-bold text-white">${title}</p>
                                <p class="text-xs text-sky-400 font-normal mt-0.5">${mType} • ${year}</p>
                            </div>
                        </div>
                    `;
                }).join(''); 
                
                r.classList.remove('hidden');

            } catch (err) {
                r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Search error: ${err.message}</div>`;
                r.classList.remove('hidden');
            }
        }

        function selectMedia(t, mt, c, y) { 
            const tIn = document.getElementById('titleInput'); 
            tIn.value = t; 
            if (c) tIn.dataset.img = c;
            
            document.getElementById('mediaTypeInput').value = mt;
            document.getElementById('yearInput').value = y;
            document.getElementById('searchResults').classList.add('hidden'); 
            document.getElementById('seriesInput').focus();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
