<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Statistics Dashboard</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN for database connection -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- NAVIGATION BAR SECTION -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-6">
            <span class="text-xl font-bold tracking-wider text-indigo-400">VAULT STATS</span>
            <div class="hidden md:flex space-x-4">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition">Dashboard</a>
                <a href="games.html" class="text-slate-400 hover:text-slate-200 transition">Games</a>
                <a href="movies.html" class="text-slate-400 hover:text-slate-200 transition">Movies</a>
                <a href="books.html" class="text-slate-400 hover:text-slate-200 transition">Books</a>
            </div>
        </div>
        <!-- Toolbox / Utility Menu -->
        <div class="relative">
            <button id="toolboxBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm transition">Toolbox</button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- PAGE HEADER -->
        <header class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight">Collection Statistics</h1>
            <p class="text-slate-400 mt-1">Aggregated overview of completed games, movies, and books across multiple years.</p>
        </header>

        <!-- HIGH-LEVEL METRICS SUMMARY CARDS -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 class="text-sm font-medium text-slate-400 uppercase tracking-wider">Total Media Logged</h3>
                <p id="totalMediaCount" class="text-3xl font-bold mt-2 text-indigo-400">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 class="text-sm font-medium text-slate-400 uppercase tracking-wider">Games Completed</h3>
                <p id="totalGamesCount" class="text-3xl font-bold mt-2 text-emerald-400">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 class="text-sm font-medium text-slate-400 uppercase tracking-wider">Movies Watched</h3>
                <p id="totalMoviesCount" class="text-3xl font-bold mt-2 text-sky-400">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 class="text-sm font-medium text-slate-400 uppercase tracking-wider">Books Read</h3>
                <p id="totalBooksCount" class="text-3xl font-bold mt-2 text-amber-400">0</p>
            </div>
        </section>

        <!-- YEARLY BREAKDOWN SECTION -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-10">
            <h2 class="text-xl font-bold mb-4 text-slate-200">Yearly Completion Breakdown</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="py-3 px-4">Year</th>
                            <th class="py-3 px-4">Games</th>
                            <th class="py-3 px-4">Movies</th>
                            <th class="py-3 px-4">Books</th>
                            <th class="py-3 px-4 font-semibold text-indigo-300">Total</th>
                        </tr>
                    </thead>
                    <tbody id="yearlyTableBody" class="divide-y divide-slate-800 text-sm">
                        <!-- Dynamically populated rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- SUPABASE CONFIG & LOGIC SCRIPT -->
    <script>
        // ==========================================
        // 1. SUPABASE INITIALIZATION CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 2. HELPER UTILITIES: MULTIPLE YEAR PARSING
        // ==========================================
        /**
         * Parses comma-separated completion years string (e.g. "2021, 2026") 
         * into a clean array of integers for multi-completion tracking[cite: 8].
         */
        function parseCompletionYears(yearsString) {
            if (!yearsString) return [];
            return String(yearsString)
                .split(',')
                .map(year => parseInt(year.trim(), 10))
                .filter(year => !isNaN(year));
        }

        // ==========================================
        // 3. DATA FETCHING & AGGREGATION LOGIC
        // ==========================================
        async function fetchAllVaultData() {
            try {
                // Fetch data concurrently from all three media tables
                const [gamesRes, moviesRes, booksRes] = await Promise.all([
                    _supabase.from('games').select('*'),
                    _supabase.from('movies').select('*'),
                    _supabase.from('books').select('*')
                ]);

                if (gamesRes.error) throw gamesRes.error;
                if (moviesRes.error) throw moviesRes.error;
                if (booksRes.error) throw booksRes.error;

                processAndRenderStats(gamesRes.data || [], moviesRes.data || [], booksRes.data || []);
            } catch (error) {
                console.error("Error fetching vault data:", error);
            }
        }

        // ==========================================
        // 4. STATISTICS PROCESSING & UI BINDING
        // ==========================================
        function processAndRenderStats(games, movies, books) {
            // Track totals
            let totalGames = games.length;
            let totalMovies = movies.length;
            let totalBooks = books.length;
            let totalMedia = totalGames + totalMovies + totalBooks;

            // Update top metric cards
            document.getElementById('totalMediaCount').innerText = totalMedia;
            document.getElementById('totalGamesCount').innerText = totalGames;
            document.getElementById('totalMoviesCount').innerText = totalMovies;
            document.getElementById('totalBooksCount').innerText = totalBooks;

            // Map to aggregate stats per year: { 2026: { games: X, movies: Y, books: Z } }
            const yearMap = {};

            // Helper to register vault items into the yearly breakdown grid
            const tallyItems = (items, type) => {
                items.forEach(item => {
                    // Uses plural column structure for multi-year completions[cite: 8]
                    const years = parseCompletionYears(item.completed_years);
                    years.forEach(year => {
                        if (!yearMap[year]) {
                            yearMap[year] = { games: 0, movies: 0, books: 0 };
                        }
                        yearMap[year][type]++;
                    });
                });
            };

            tallyItems(games, 'games');
            tallyItems(movies, 'movies');
            tallyItems(books, 'books');

            // Render Yearly Table rows sorted descending by year
            const tableBody = document.getElementById('yearlyTableBody');
            tableBody.innerHTML = '';

            const sortedYears = Object.keys(yearMap).sort((a, b) => b - a);

            if (sortedYears.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="py-4 px-4 text-center text-slate-500">No completion records found.</td></tr>`;
                return;
            }

            sortedYears.forEach(year => {
                const data = yearMap[year];
                const rowTotal = data.games + data.movies + data.books;
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-950/50 transition';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-300">${year}</td>
                    <td class="py-3 px-4 text-emerald-400">${data.games}</td>
                    <td class="py-3 px-4 text-sky-400">${data.movies}</td>
                    <td class="py-3 px-4 text-amber-400">${data.books}</td>
                    <td class="py-3 px-4 font-bold text-indigo-300">${rowTotal}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ==========================================
        // 5. INITIALIZATION ON DOM LOAD
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            fetchAllVaultData();
        });
    </script>
</body>
</html>
