<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Stats</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN for database connection -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- NAVIGATION BAR SECTION -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <!-- Left Navigation Icons -->
        <div class="flex items-center space-x-3">
            <a href="index.html" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition text-slate-300" title="Dashboard">🏠</a>
            <a href="games.html" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition text-slate-300" title="Games">🎮</a>
            <a href="movies.html" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition text-slate-300" title="Movies">🎬</a>
            <a href="books.html" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition text-slate-300" title="Books">📚</a>
        </div>

        <!-- Center Title -->
        <h1 class="text-xl font-black tracking-widest text-cyan-400">VAULT STATS</h1>

        <!-- Right Utilities / Toolbox Menu -->
        <div class="flex items-center space-x-3">
            <button id="statsViewBtn" class="p-2.5 bg-cyan-600 hover:bg-cyan-500 rounded-lg transition text-white" title="Stats View">📊</button>
            <button id="toolboxBtn" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition text-slate-300" title="Toolbox">🧰</button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- FILTERS SECTION -->
        <section class="mb-6 flex items-center space-x-4">
            <div class="flex flex-col">
                <label class="text-xs uppercase tracking-wider text-slate-400 mb-1">Filters</label>
                <select id="yearFilter" class="bg-slate-900 border border-slate-800 text-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
                    <option value="all">All Time</option>
                </select>
            </div>
        </section>

        <!-- TOTAL COMPLETED MEDIA METRICS SECTION -->
        <section class="mb-8">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 mb-3">Total Completed Media</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Combined Total Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 relative overflow-hidden">
                    <div class="flex items-center space-x-2 text-amber-400 mb-2">
                        <span>🏆</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">Combined Total</span>
                    </div>
                    <p id="totalMediaCount" class="text-3xl font-extrabold text-slate-100">0</p>
                </div>
                <!-- Movies & Shows Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex items-center space-x-2 text-purple-400 mb-2">
                        <span>🎬</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">Movies & Shows Watched</span>
                    </div>
                    <p id="totalMoviesCount" class="text-3xl font-extrabold text-slate-100">0</p>
                </div>
                <!-- Games Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex items-center space-x-2 text-indigo-400 mb-2">
                        <span>🎮</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">Games Completed</span>
                    </div>
                    <p id="totalGamesCount" class="text-3xl font-extrabold text-slate-100">0</p>
                </div>
                <!-- Books Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex items-center space-x-2 text-emerald-400 mb-2">
                        <span>📚</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">Books Read</span>
                    </div>
                    <p id="totalBooksCount" class="text-3xl font-extrabold text-slate-100">0</p>
                </div>
            </div>
        </section>

        <!-- YEARLY BREAKDOWN SECTION -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 mb-3">Yearly Breakdown</h2>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                                <th class="py-4 px-6 font-medium">Year Completed</th>
                                <th class="py-4 px-6 font-medium">🎬 Movies/Shows</th>
                                <th class="py-4 px-6 font-medium">🎮 Games</th>
                                <th class="py-4 px-6 font-medium">📚 Books</th>
                                <th class="py-4 px-6 font-medium text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="yearlyTableBody" class="divide-y divide-slate-800/60 text-sm">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- COMPLETED ITEMS LOG SECTION -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 mb-3">Completed Items Log</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Movies Log Box -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col h-96">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-purple-400 flex items-center space-x-2"><span>🎬</span> <span>Movies & Shows</span></span>
                        <span id="moviesLogBadge" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded-full font-semibold">0</span>
                    </div>
                    <div id="moviesLogList" class="overflow-y-auto space-y-2 pr-1 flex-grow text-sm divide-y divide-slate-800/40">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Games Log Box -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col h-96">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center space-x-2"><span>🎮</span> <span>Games</span></span>
                        <span id="gamesLogBadge" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded-full font-semibold">0</span>
                    </div>
                    <div id="gamesLogList" class="overflow-y-auto space-y-2 pr-1 flex-grow text-sm divide-y divide-slate-800/40">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Books Log Box -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col h-96">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center space-x-2"><span>📚</span> <span>Books</span></span>
                        <span id="booksLogBadge" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded-full font-semibold">0</span>
                    </div>
                    <div id="booksLogList" class="overflow-y-auto space-y-2 pr-1 flex-grow text-sm divide-y divide-slate-800/40">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- SUPABASE CONFIG & LOGIC SCRIPT -->
    <script>
        // ==========================================
        // 1. SUPABASE INITIALIZATION CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Global cache for vault records
        let cachedData = { games: [], movies: [], books: [] };

        // ==========================================
        // 2. HELPER UTILITIES: MULTIPLE YEAR PARSING
        // ==========================================
        /**
         * Parses comma-separated completion years string (e.g. "2021, 2026") 
         * into a clean array of integers for multi-completion tracking[cite: 8].
         */
        function parseCompletionYears(yearsString) {
            if (!yearsString) return [];
            return String(yearsString)
                .split(',')
                .map(year => parseInt(year.trim(), 10))
                .filter(year => !isNaN(year));
        }

        // ==========================================
        // 3. DATA FETCHING & SYNCHRONIZATION LOGIC
        // ==========================================
        async function fetchAllVaultData() {
            try {
                const [gamesRes, moviesRes, booksRes] = await Promise.all([
                    _supabase.from('games').select('*'),
                    _supabase.from('movies').select('*'),
                    _supabase.from('books').select('*')
                ]);

                if (gamesRes.error) throw gamesRes.error;
                if (moviesRes.error) throw moviesRes.error;
                if (booksRes.error) throw booksRes.error;

                cachedData.games = gamesRes.data || [];
                cachedData.movies = moviesRes.data || [];
                cachedData.books = booksRes.data || [];

                populateYearFilterOptions();
                filterAndRenderStats();
            } catch (error) {
                console.error("Error fetching vault data:", error);
            }
        }

        // Populate dropdown filter options based on available completion years
        function populateYearFilterOptions() {
            const yearSet = new Set();
            const collectYears = (items) => {
                items.forEach(item => {
                    const years = parseCompletionYears(item.completed_years);
                    years.forEach(y => yearSet.add(y));
                });
            };

            collectYears(cachedData.games);
            collectYears(cachedData.movies);
            collectYears(cachedData.books);

            const sortedYears = Array.from(yearSet).sort((a, b) => b - a);
            const selectEl = document.getElementById('yearFilter');
            
            // Keep "All Time" option, clear rest
            selectEl.innerHTML = `<option value="all">All Time</option>`;
            sortedYears.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                selectEl.appendChild(opt);
            });
        }

        // ==========================================
        // 4. STATISTICS PROCESSING & UI BINDING
        // ==========================================
        function filterAndRenderStats() {
            const selectedFilter = document.getElementById('yearFilter').value;

            // Filter items based on selected year (supports multi-year matches)
            const matchesFilter = (item) => {
                if (selectedFilter === 'all') return true;
                const targetYear = parseInt(selectedFilter, 10);
                const years = parseCompletionYears(item.completed_years);
                return years.includes(targetYear);
            };

            const filteredGames = cachedData.games.filter(matchesFilter);
            const filteredMovies = cachedData.movies.filter(matchesFilter);
            const filteredBooks = cachedData.books.filter(matchesFilter);

            // Update top metric summary cards
            document.getElementById('totalGamesCount').innerText = filteredGames.length;
            document.getElementById('totalMoviesCount').innerText = filteredMovies.length;
            document.getElementById('totalBooksCount').innerText = filteredBooks.length;
            document.getElementById('totalMediaCount').innerText = filteredGames.length + filteredMovies.length + filteredBooks.length;

            // Render yearly breakdown table (Always built from full vault data to show history grid)
            renderYearlyBreakdownTable();

            // Render individual log lists
            renderLogLists(filteredMovies, filteredGames, filteredBooks);
        }

        // Render the Yearly Breakdown Table summarizing all completion years
        function renderYearlyBreakdownTable() {
            const yearMap = {};

            const tallyItems = (items, type) => {
                items.forEach(item => {
                    const years = parseCompletionYears(item.completed_years);
                    if (years.length === 0) {
                        // Handle items with no completed year specified
                        if (!yearMap['Uncategorized']) {
                            yearMap['Uncategorized'] = { games: 0, movies: 0, books: 0 };
                        }
                        yearMap['Uncategorized'][type]++;
                    } else {
                        years.forEach(year => {
                            if (!yearMap[year]) {
                                yearMap[year] = { games: 0, movies: 0, books: 0 };
                            }
                            yearMap[year][type]++;
                        });
                    }
                });
            };

            tallyItems(cachedData.games, 'games');
            tallyItems(cachedData.movies, 'movies');
            tallyItems(cachedData.books, 'books');

            const tableBody = document.getElementById('yearlyTableBody');
            tableBody.innerHTML = '';

            const keys = Object.keys(yearMap);
            // Sort numerical years descending, keep 'Uncategorized' at the top or bottom as appropriate
            const sortedKeys = keys.sort((a, b) => {
                if (a === 'Uncategorized') return -1;
                if (b === 'Uncategorized') return 1;
                return b - a;
            });

            if (sortedKeys.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="py-4 px-6 text-center text-slate-500">No completion records found.</td></tr>`;
                return;
            }

            sortedKeys.forEach(key => {
                const data = yearMap[key];
                const rowTotal = data.games + data.movies + data.books;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-950/40 transition';
                tr.innerHTML = `
                    <td class="py-4 px-6 font-semibold text-cyan-400">${key}</td>
                    <td class="py-4 px-6 text-purple-300">${data.movies}</td>
                    <td class="py-4 px-6 text-indigo-300">${data.games}</td>
                    <td class="py-4 px-6 text-emerald-300">${data.books}</td>
                    <td class="py-4 px-6 font-bold text-slate-100 text-right">${rowTotal}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Render lists inside the Completed Items Log 3-column container
        function renderLogLists(movies, games, books) {
            document.getElementById('moviesLogBadge').innerText = movies.length;
            document.getElementById('gamesLogBadge').innerText = games.length;
            document.getElementById('booksLogBadge').innerText = books.length;

            const renderListItems = (containerId, items, titleKey) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                if (items.length === 0) {
                    container.innerHTML = `<div class="py-3 text-center text-slate-500 text-xs">No items found</div>`;
                    return;
                }
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'py-2 text-slate-300 truncate';
                    div.textContent = item[titleKey] || item.title || item.name || 'Untitled';
                    container.appendChild(div);
                });
            };

            renderListItems('moviesLogList', movies, 'title');
            renderListItems('gamesLogList', games, 'title');
            renderListItems('booksLogList', books, 'title');
        }

        // ==========================================
        // 5. EVENT LISTENERS & INITIALIZATION
        // ==========================================
        document.getElementById('yearFilter').addEventListener('change', filterAndRenderStats);

        document.addEventListener('DOMContentLoaded', () => {
            fetchAllVaultData();
        });
    </script>
</body>
</html>
