<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Statistics</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
        .stat-card { background-color: #1e293b; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; }
        #authScreen { background-color: #0b0f19; position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .col-filter { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 99px; padding: 4px 16px; font-size: 11px; outline: none; color: white; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">

    <div id="authScreen">
        <div class="bg-slate-800 p-10 rounded-[3rem] border border-slate-700 shadow-2xl w-full max-w-sm text-center">
            <div class="mb-2 text-cyan-400 text-6xl font-black italic tracking-tighter uppercase leading-none text-white">Vault</div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-8">Authentication Required</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 px-6 rounded-2xl font-black hover:bg-slate-100 transition flex items-center justify-center gap-3 uppercase tracking-wider text-sm shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.8 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/>
                    <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.16c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <button title="Vault Statistics" class="bg-cyan-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg">📊</button>
                   <button onclick="window.location.href='index.html'" title="Home Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🏠</button>
                   <button onclick="window.location.href='movies.html'" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</button>
                   <button onclick="window.location.href='games.html'" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</button>
                   <button onclick="window.location.href='books.html'" title="Books Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">📚</button>
                   <button onclick="logout()" title="Sign Out" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-cyan-500 uppercase italic">Vault Stats</h1>
                <div class="flex items-center gap-2">
                    <select id="yearFilter" onchange="renderStats()" class="col-filter py-2 px-4 text-xs font-bold text-cyan-400">
                        <option value="ALL">All Time</option>
                    </select>
                </div>
            </header>

            <!-- Overall Combined Summary -->
            <div class="mb-10">
                <h2 class="text-slate-400 font-black text-xs uppercase tracking-[0.3em] mb-4">Total Completed Media</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="stat-card border-cyan-500/40 bg-cyan-950/20">
                        <span class="text-3xl">🏆</span>
                        <div class="text-xs font-bold uppercase text-cyan-400 mt-2">Combined Total</div>
                        <div id="stat-total" class="text-4xl font-black text-white mt-1">0</div>
                    </div>
                    <div class="stat-card">
                        <span class="text-3xl">🎬</span>
                        <div class="text-xs font-bold uppercase text-cyan-400 mt-2">Movies & Shows Watched</div>
                        <div id="stat-movies" class="text-4xl font-black text-white mt-1">0</div>
                    </div>
                    <div class="stat-card">
                        <span class="text-3xl">🎮</span>
                        <div class="text-xs font-bold uppercase text-indigo-400 mt-2">Games Completed</div>
                        <div id="stat-games" class="text-4xl font-black text-white mt-1">0</div>
                    </div>
                    <div class="stat-card">
                        <span class="text-3xl">📚</span>
                        <div class="text-xs font-bold uppercase text-emerald-400 mt-2">Books Read</div>
                        <div id="stat-books" class="text-4xl font-black text-white mt-1">0</div>
                    </div>
                </div>
            </div>

            <!-- Breakdown By Year -->
            <div class="mb-10">
                <h2 class="text-slate-400 font-black text-xs uppercase tracking-[0.3em] mb-4">Yearly Breakdown</h2>
                <div class="bg-slate-800 rounded-[2rem] border border-slate-700 p-6 overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="text-xs font-black uppercase text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="pb-3 px-4">Year Completed</th>
                                <th class="pb-3 px-4">🎬 Movies/Shows</th>
                                <th class="pb-3 px-4">🎮 Games</th>
                                <th class="pb-3 px-4">📚 Books</th>
                                <th class="pb-3 px-4 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="yearlyTableBody" class="divide-y divide-slate-700/50 font-bold">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Detailed Completed Lists -->
            <div>
                <h2 class="text-slate-400 font-black text-xs uppercase tracking-[0.3em] mb-4">Completed Items Log</h2>
                <div id="completedLog" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">
                        <h3 class="text-sm font-black text-cyan-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>🎬 Movies & Shows</span>
                            <span id="log-movies-count" class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-white">0</span>
                        </h3>
                        <ul id="log-movies" class="space-y-2 text-xs text-slate-300 max-h-96 overflow-y-auto pr-1"></ul>
                    </div>

                    <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">
                        <h3 class="text-sm font-black text-indigo-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>🎮 Games</span>
                            <span id="log-games-count" class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-white">0</span>
                        </h3>
                        <ul id="log-games" class="space-y-2 text-xs text-slate-300 max-h-96 overflow-y-auto pr-1"></ul>
                    </div>

                    <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60">
                        <h3 class="text-sm font-black text-emerald-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>📚 Books</span>
                            <span id="log-books-count" class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-white">0</span>
                        </h3>
                        <ul id="log-books" class="space-y-2 text-xs text-slate-300 max-h-96 overflow-y-auto pr-1"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';

        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let completedMovies = [], completedGames = [], completedBooks = [];

        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(); else showAuth();
            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) showApp(); else showAuth();
            });
        }

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
            if (error) alert("OAuth error: " + error.message);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            showAuth();
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            fetchAllData();
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        async function fetchAllData() {
            const [mRes, gRes, bRes] = await Promise.all([
                supabaseClient.from('movies').select('*').eq('status', 'Watched'),
                supabaseClient.from('games').select('*').in('status', ['Completed', 'Finished', 'Beaten']),
                supabaseClient.from('books').select('*').in('status', ['Read', 'Completed', 'Finished'])
            ]);

            completedMovies = mRes.data || [];
            completedGames = gRes.data || [];
            completedBooks = bRes.data || [];

            populateYearDropdown();
            renderStats();
        }

        function populateYearDropdown() {
            const dropdown = document.getElementById('yearFilter');
            dropdown.innerHTML = '<option value="ALL">All Time</option>';

            const yearsSet = new Set();
            [...completedMovies, ...completedGames, ...completedBooks].forEach(item => {
                if (item.completed_year) yearsSet.add(item.completed_year);
            });

            const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
            sortedYears.forEach(y => {
                dropdown.innerHTML += `<option value="${y}">${y}</option>`;
            });
        }

        function renderStats() {
            const selectedYear = document.getElementById('yearFilter').value;

            const filterByYear = (list) => {
                if (selectedYear === 'ALL') return list;
                return list.filter(item => String(item.completed_year) === String(selectedYear));
            };

            const movies = filterByYear(completedMovies);
            const games = filterByYear(completedGames);
            const books = filterByYear(completedBooks);

            // Set Individual and Total Counts
            document.getElementById('stat-movies').innerText = movies.length;
            document.getElementById('stat-games').innerText = games.length;
            document.getElementById('stat-books').innerText = books.length;
            document.getElementById('stat-total').innerText = movies.length + games.length + books.length;

            renderYearlyTable();
            renderLogs(movies, games, books);
        }

        function renderYearlyTable() {
            const tableBody = document.getElementById('yearlyTableBody');
            tableBody.innerHTML = '';

            const yearlyData = {};

            const processItem = (item, type) => {
                const year = item.completed_year || 'Uncategorized';
                if (!yearlyData[year]) yearlyData[year] = { movies: 0, games: 0, books: 0 };
                yearlyData[year][type]++;
            };

            completedMovies.forEach(m => processItem(m, 'movies'));
            completedGames.forEach(g => processItem(g, 'games'));
            completedBooks.forEach(b => processItem(b, 'books'));

            const sortedYears = Object.keys(yearlyData).sort((a, b) => {
                if (a === 'Uncategorized') return 1;
                if (b === 'Uncategorized') return -1;
                return b - a;
            });

            if (sortedYears.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="py-4 px-4 text-center text-slate-500 italic">No completed media records found.</td></tr>`;
                return;
            }

            sortedYears.forEach(year => {
                const row = yearlyData[year];
                const total = row.movies + row.games + row.books;
                tableBody.innerHTML += `
                    <tr class="hover:bg-slate-700/30 transition-colors">
                        <td class="py-3 px-4 text-cyan-400 font-bold">${year}</td>
                        <td class="py-3 px-4">${row.movies}</td>
                        <td class="py-3 px-4">${row.games}</td>
                        <td class="py-3 px-4">${row.books}</td>
                        <td class="py-3 px-4 text-right font-black text-white">${total}</td>
                    </tr>
                `;
            });
        }

        function renderLogs(movies, games, books) {
            const createListHTML = (items, keyTitle) => {
                if (items.length === 0) return `<li class="text-slate-500 italic py-1">None logged</li>`;
                return items.map(i => {
                    const yearBadge = i.completed_year ? `<span class="text-[10px] text-cyan-400 bg-cyan-950/60 px-1.5 py-0.5 rounded border border-cyan-800/50">${i.completed_year}</span>` : '';
                    return `<li class="flex items-center justify-between py-1 border-b border-slate-700/30">
                        <span class="truncate pr-2">${i.title || i[keyTitle]}</span>
                        ${yearBadge}
                    </li>`;
                }).join('');
            };

            document.getElementById('log-movies').innerHTML = createListHTML(movies, 'title');
            document.getElementById('log-games').innerHTML = createListHTML(games, 'title');
            document.getElementById('log-books').innerHTML = createListHTML(books, 'title');

            document.getElementById('log-movies-count').innerText = movies.length;
            document.getElementById('log-games-count').innerText = games.length;
            document.getElementById('log-books-count').innerText = books.length;
        }

        initAuth();
    </script>
</body>
</html>
