<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Quest Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .drag-ghost { opacity: 0.4; background: #334155 !important; }
        .drag-chosen { border: 2px solid #3b82f6 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-mx-auto space-y-6">
        
        <!-- Header Controls -->
        <header class="flex flex-wrap justify-between items-center gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-amber-400">Book Quest Hub</h1>
                <p class="text-sm text-slate-400 mt-1" id="hubSubtitle">Track, prioritize, and conquer your reading backlog.</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="importCSV(event)">
                <div class="flex items-center gap-2">
                    <div id="toolboxContainer" class="relative">
                        <button onclick="toggleToolbox(event)" title="Toolbox" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div id="toolboxMenu" class="hidden flex-col gap-2 absolute left-0 top-full mt-2 p-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50">
                            <button onclick="downloadTemplate()" title="CSV Template" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600 flex items-center justify-center">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600 flex items-center justify-center">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist Vault" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-amber-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Finished Archive" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
            </div>
        </header>

        <!-- Main Form & Search -->
        <div id="activeControls" class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2"><span>➕</span> Add New Book</h2>
                <form id="addBookForm" onsubmit="handleAddBook(event)" class="space-y-3">
                    <div class="relative">
                        <input type="text" id="titleInput" placeholder="Book Title *" required oninput="handleSearch(this.value)" autocomplete="off" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
                        <div id="searchResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl max-h-48 overflow-y-auto z-50 shadow-2xl divide-y divide-slate-700"></div>
                    </div>
                    <input type="text" id="authorInput" placeholder="Author" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
                    <div class="relative">
                        <input type="text" id="seriesInput" placeholder="Series (Optional)" oninput="handleSeriesSearch(this.value)" autocomplete="off" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
                        <div id="seriesResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl max-h-36 overflow-y-auto z-50 shadow-2xl divide-y divide-slate-700"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="seriesNumInput" placeholder="Book #" step="any" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
                        <select id="formatInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-300">
                            <option value="Physical">Physical</option>
                            <option value="E-Book">E-Book</option>
                            <option value="Audiobook">Audiobook</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-2 p-2 bg-slate-800/50 rounded-xl border border-slate-700/50 cursor-pointer text-sm text-slate-300">
                        <input type="checkbox" id="wishlistCheck" class="rounded border-slate-700 bg-slate-800 text-amber-500 focus:ring-0">
                        <span>Save to Wishlist Vault</span>
                    </label>
                    <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 rounded-xl transition-all duration-200">Add to Backlog</button>
                </form>
            </div>

            <!-- List Area -->
            <div class="md:col-span-2 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                    <div class="flex gap-2">
                        <button onclick="setFilter('all')" id="filterAll" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-white">All</button>
                        <button onclick="setFilter('Physical')" id="filterPhysical" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">Physical</button>
                        <button onclick="setFilter('E-Book')" id="filterEBook" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">E-Book</button>
                        <button onclick="setFilter('Audiobook')" id="filterAudiobook" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">Audiobook</button>
                    </div>
                    <div class="text-xs text-slate-500 font-mono" id="itemCount">0 Items</div>
                </div>

                <div id="bookList" class="space-y-3"></div>
            </div>
        </div>

        <!-- Archive/Wishlist/Trash Views Container -->
        <div id="secondaryView" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h2 id="secondaryTitle" class="text-xl font-bold text-emerald-400">Archive</h2>
                <button onclick="toggleView('main')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm border border-slate-700">← Back to Hub</button>
            </div>
            <div id="secondaryList" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_KEY";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let books = [];
        let currentView = 'main'; // main, archive, wishlist, trash
        let activeFilter = 'all';
        let sortableInstance = null;

        async function fetchBooks() {
            const { data, error } = await supabase.from('books').select('*').order('sort_order', { ascending: true });
            if (!error && data) {
                books = data;
                render();
            }
        }

        function toggleToolbox(e) {
            e.stopPropagation();
            const menu = document.getElementById('toolboxMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#seriesInput') && !e.target.closest('#seriesResults')) { document.getElementById('seriesResults').classList.add('hidden'); }
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) { document.getElementById('searchResults').classList.add('hidden'); }
            if (!e.target.closest('#toolboxContainer')) { 
                const tb = document.getElementById('toolboxMenu'); 
                if (tb) { tb.classList.add('hidden'); tb.classList.remove('flex'); } 
            }
        });

        async function handleAddBook(e) {
            e.preventDefault();
            const title = document.getElementById('titleInput').value.trim();
            const author = document.getElementById('authorInput').value.trim();
            const series = document.getElementById('seriesInput').value.trim();
            const series_num = parseFloat(document.getElementById('seriesNumInput').value) || null;
            const format = document.getElementById('formatInput').value;
            const isWishlist = document.getElementById('wishlistCheck').checked;

            if (!title) return;

            const minSort = books.length > 0 ? Math.min(...books.map(b => b.sort_order || 0)) : 0;
            const newOrder = minSort - 1;

            const newBook = {
                title, author, series, series_num, format,
                status: isWishlist ? 'wishlist' : 'backlog',
                sort_order: newOrder
            };

            const { data, error } = await supabase.from('books').insert([newBook]).select();
            if (!error && data) {
                books.unshift(data[0]);
                document.getElementById('addBookForm').reset();
                render();
            }
        }

        async function updateStatus(id, newStatus) {
            const { error } = await supabase.from('books').update({ status: newStatus }).eq('id', id);
            if (!error) {
                const book = books.find(b => b.id === id);
                if (book) book.status = newStatus;
                render();
            }
        }

        async function deletePermanently(id) {
            const { error } = await supabase.from('books').delete().eq('id', id);
            if (!error) {
                books = books.filter(b => b.id !== id);
                render();
            }
        }

        function setFilter(filter) {
            activeFilter = filter;
            ['all', 'Physical', 'E-Book', 'Audiobook'].forEach(f => {
                const btn = document.getElementById(`filter${f.replace('-', '')}`);
                if (btn) {
                    btn.className = f === activeFilter 
                        ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-white' 
                        : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700';
                }
            });
            render();
        }

        function toggleView(view) {
            currentView = view;
            const activeControls = document.getElementById('activeControls');
            const secondaryView = document.getElementById('secondaryView');
            const secondaryTitle = document.getElementById('secondaryTitle');

            if (view === 'main') {
                activeControls.classList.remove('hidden');
                secondaryView.classList.add('hidden');
            } else {
                activeControls.classList.add('hidden');
                secondaryView.classList.remove('hidden');
                if (view === 'archive') {
                    secondaryTitle.textContent = 'Finished Archive 🏆';
                    secondaryTitle.className = 'text-xl font-bold text-emerald-400';
                } else if (view === 'wishlist') {
                    secondaryTitle.textContent = 'Wishlist Vault 🪄';
                    secondaryTitle.className = 'text-xl font-bold text-amber-400';
                } else if (view === 'trash') {
                    secondaryTitle.textContent = 'Trash 🗑️';
                    secondaryTitle.className = 'text-xl font-bold text-rose-400';
                }
            }
            render();
        }

        function render() {
            if (currentView === 'main') {
                const listEl = document.getElementById('bookList');
                listEl.innerHTML = '';

                let filtered = books.filter(b => b.status === 'backlog');
                if (activeFilter !== 'all') {
                    filtered = filtered.filter(b => b.format === activeFilter);
                }

                document.getElementById('itemCount').textContent = `${filtered.length} Items`;

                filtered.forEach(book => {
                    const card = createCard(book);
                    listEl.appendChild(card);
                });

                initSortable();
            } else {
                const listEl = document.getElementById('secondaryList');
                listEl.innerHTML = '';

                const filtered = books.filter(b => b.status === currentView);
                filtered.forEach(book => {
                    const card = createCard(book);
                    listEl.appendChild(card);
                });
            }
        }

        function createCard(book) {
            const card = document.createElement('div');
            card.dataset.id = book.id;
            card.className = 'bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4 group hover:border-slate-700 transition-all';

            const seriesText = book.series ? `${book.series} #${book.series_num || ''}` : '';
            
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    ${currentView === 'main' ? '<span class="cursor-grab text-slate-600 hover:text-slate-400">⣿</span>' : ''}
                    <div>
                        <div class="font-semibold text-slate-100">${book.title}</div>
                        <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                            <span>${book.author || 'Unknown Author'}</span>
                            ${seriesText ? `<span class="bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded text-cyan-400">${seriesText}</span>` : ''}
                            <span class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700/50">${book.format}</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    ${getCardActions(book)}
                </div>
            `;
            return card;
        }

        function getCardActions(book) {
            if (currentView === 'main') {
                return `
                    <button onclick="updateStatus(${book.id}, 'archive')" title="Archive" class="p-1.5 hover:bg-emerald-900/30 text-emerald-500 rounded-lg">🏆</button>
                    <button onclick="updateStatus(${book.id}, 'trash')" title="Move to Trash" class="p-1.5 hover:bg-rose-900/30 text-rose-500 rounded-lg">🗑️</button>
                `;
            } else if (currentView === 'trash') {
                return `
                    <button onclick="updateStatus(${book.id}, 'backlog')" title="Restore" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400">↩️</button>
                    <button onclick="deletePermanently(${book.id})" title="Delete Forever" class="p-1.5 hover:bg-rose-900/30 text-rose-500 rounded-lg">❌</button>
                `;
            } else {
                return `
                    <button onclick="updateStatus(${book.id}, 'backlog')" title="Move to Backlog" class="p-1.5 hover:bg-cyan-900/30 text-cyan-400 rounded-lg">➕</button>
                    <button onclick="updateStatus(${book.id}, 'trash')" title="Move to Trash" class="p-1.5 hover:bg-rose-900/30 text-rose-500 rounded-lg">🗑️</button>
                `;
            }
        }

        function initSortable() {
            const listEl = document.getElementById('bookList');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(listEl, {
                animation: 150,
                ghostClass: 'drag-ghost',
                chosenClass: 'drag-chosen',
                onEnd: async function () {
                    const itemEls = listEl.querySelectorAll('[data-id]');
                    const updates = [];
                    itemEls.forEach((el, index) => {
                        const id = parseInt(el.dataset.id);
                        const book = books.find(b => b.id === id);
                        if (book) {
                            book.sort_order = index;
                            updates.push(supabase.from('books').update({ sort_order: index }).eq('id', id));
                        }
                    });
                    await Promise.all(updates);
                }
            });
        }

        // Open Library API Search
        async function handleSearch(query) {
            const resultsEl = document.getElementById('searchResults');
            if (query.length < 3) {
                resultsEl.classList.add('hidden');
                return;
            }

            try {
                const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=5`);
                const data = await res.json();
                
                resultsEl.innerHTML = '';
                if (data.docs && data.docs.length > 0) {
                    data.docs.forEach(doc => {
                        const div = document.createElement('div');
                        div.className = 'p-2 hover:bg-slate-700 cursor-pointer text-xs';
                        div.textContent = `${doc.title} ${doc.author_name ? 'by ' + doc.author_name[0] : ''}`;
                        div.onclick = () => {
                            document.getElementById('titleInput').value = doc.title;
                            if (doc.author_name) document.getElementById('authorInput').value = doc.author_name[0];
                            resultsEl.classList.add('hidden');
                        };
                        resultsEl.appendChild(div);
                    });
                    resultsEl.classList.remove('hidden');
                } else {
                    resultsEl.classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function handleSeriesSearch(query) {
            const resultsEl = document.getElementById('seriesResults');
            if (!query) {
                resultsEl.classList.add('hidden');
                return;
            }

            const seriesList = [...new Set(books.map(b => b.series).filter(Boolean))];
            const matches = seriesList.filter(s => s.toLowerCase().includes(query.toLowerCase()));

            resultsEl.innerHTML = '';
            if (matches.length > 0) {
                matches.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'p-2 hover:bg-slate-700 cursor-pointer text-xs';
                    div.textContent = s;
                    div.onclick = () => {
                        document.getElementById('seriesInput').value = s;
                        resultsEl.classList.add('hidden');
                    };
                    resultsEl.appendChild(div);
                });
                resultsEl.classList.remove('hidden');
            } else {
                resultsEl.classList.add('hidden');
            }
        }

        function downloadTemplate() {
            const csvContent = "data:text/csv;charset=utf-8,Title,Author,Series,SeriesNum,Format,Status\nThe Hobbit,J.R.R. Tolkien,Middle-earth,1,Physical,backlog\n";
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "books_template.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const lines = event.target.result.split('\n');
                const newBooks = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const [title, author, series, series_num, format, status] = line.split(',');
                    if (title) {
                        newBooks.push({
                            title: title.trim(),
                            author: author ? author.trim() : '',
                            series: series ? series.trim() : '',
                            series_num: series_num ? parseFloat(series_num) : null,
                            format: format ? format.trim() : 'Physical',
                            status: status ? status.trim() : 'backlog',
                            sort_order: i
                        });
                    }
                }

                if (newBooks.length > 0) {
                    const { data, error } = await supabase.from('books').insert(newBooks).select();
                    if (!error) {
                        fetchBooks();
                    }
                }
            };
            reader.readAsText(file);
        }

        fetchBooks();
    </script>
</body>
</html>
