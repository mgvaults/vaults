<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Books</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
        .book-card { background-color: #1e293b; border-radius: 1rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .book-card img { width: 100%; max-height: 280px; object-fit: contain; background-color: #0f172a; border-radius: 0.5rem; }
        .type-box { width: 40px; height: 40px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; cursor: pointer; transition: all 0.2s; opacity: 0.25; color: black; font-weight: 900; }
        .type-box.active { opacity: 1; transform: scale(1.08); border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
        #authScreen { background-color: #0b0f19; position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .type-badge { font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 4px; color: white; text-transform: uppercase; background: #334155; display: inline-block; }
        .col-filter { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 99px; padding: 4px 16px; font-size: 11px; outline: none; width: 220px; color: white; }
        #searchResults::-webkit-scrollbar, #seriesResults::-webkit-scrollbar { width: 8px; }
        #searchResults::-webkit-scrollbar-track, #seriesResults::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        #searchResults::-webkit-scrollbar-thumb, #seriesResults::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; border: 2px solid #1e293b; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">

    <div id="authScreen">
        <div class="bg-slate-800 p-10 rounded-[3rem] border border-slate-700 shadow-2xl w-full max-w-sm text-center">
            <div class="mb-2 text-amber-400 text-6xl font-black italic tracking-tighter uppercase leading-none text-white">Vault</div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-8">Authentication Required</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 px-6 rounded-2xl font-black hover:bg-slate-100 transition flex items-center justify-center gap-3 uppercase tracking-wider text-sm shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1c-4.31 0-8.01 2.47-9.82 6.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <button onclick="toggleView('queue')" title="Books Vault" class="bg-amber-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg">📚</button>
                   <button onclick="window.location.href='index.html'" title="Home Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🏠</button>
                   <button onclick="window.location.href='games.html'" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</button>
                   <button onclick="window.location.href='movies.html'" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</button>
                   <button onclick="logout()" title="Sign Out" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-amber-500 uppercase italic">Books Vault</h1>
                <div class="flex items-center gap-2">
                    <div class="relative group">
                        <button class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="hidden group-hover:flex flex-col gap-2 absolute left-0 top-full mt-2 p-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50">
                            <button onclick="downloadTemplate()" title="CSV Template" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist Vault" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-amber-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Finished Archive" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12 items-stretch">
                <div id="activeSessionBox" class="lg:col-span-5 bg-amber-950/20 p-5 rounded-[2.5rem] border border-amber-500/20 shadow-inner flex flex-col justify-between">
                    <h2 class="text-amber-400 font-black text-xs uppercase tracking-widest mb-3 flex items-center gap-3 italic justify-start">Currently Reading 📖</h2>
                    <div id="col-reading" class="flex-1 flex flex-col gap-3 justify-center"></div>
                </div>
                
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 shadow-2xl relative flex flex-col justify-center">
                    <div class="flex flex-col gap-3 relative">
                        <div class="text-[10px] font-black text-amber-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">Search</span>
                            <div class="flex gap-2">
                                <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-slate-400 hover:text-white text-xs font-bold">Cancel</button>
                                <button id="deleteSelectedBtn" onclick="deleteSelectedFromForm()" class="hidden text-red-400 hover:text-red-300 text-xs font-bold">🗑️ Delete</button>
                            </div>
                        </div>
                        
                        <input id="titleInput" type="text" oninput="searchBooks(this.value)" placeholder="Search for book title or ISBN..." class="w-full bg-slate-900 p-4 rounded-2xl outline-none border border-slate-700 text-white text-sm">
                        <div id="searchResults" class="hidden absolute top-[85px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[350px] z-50 text-white"></div>
                        
                        <div class="flex flex-wrap justify-center gap-2 py-2 border-y border-slate-700/40">
                            <div onclick="toggleType('Book')" id="i-book" class="type-box active" title="Book"><span style="color:#f59e0b; font-size: 16px;">📚</span></div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input id="authorInput" type="text" placeholder="Author Name" class="bg-slate-900 p-3.5 rounded-2xl text-white border border-slate-700 text-xs font-bold">
                            <div class="relative">
                                <input id="seriesInput" type="text" oninput="filterSeriesDropdown(this.value)" onfocus="filterSeriesDropdown(this.value)" placeholder="Series Name (Optional)" class="w-full bg-slate-900 p-3.5 rounded-2xl text-white border border-slate-700 text-xs font-bold italic">
                                <div id="seriesResults" class="hidden absolute left-0 right-0 bottom-full mb-2 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[180px] z-50 text-white"></div>
                            </div>
                        </div>

                        <div class="flex gap-3 text-white relative">
                            <input id="seriesNumInput" type="number" step="0.1" placeholder="Book #" class="w-28 bg-slate-900 p-3.5 rounded-2xl text-white border border-slate-700 text-xs font-bold">
                            <button onclick="submitForm()" id="submitBtn" class="flex-1 bg-amber-600 px-8 rounded-2xl font-black uppercase text-xs text-white hover:bg-amber-500 transition">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="queueView">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-slate-400 font-black text-xs uppercase tracking-[0.3em]">Bookshelf Collection</h2>
                    <input id="filterMain" type="text" oninput="render()" placeholder="Filter collection..." class="col-filter">
                </div>
                <div id="col-main" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            </div>

            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-8">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-emerald-400 text-center">Finished Archive 🏆</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter titles..." class="col-filter">
                </div>
                <div id="col-alt" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            </div>

            <div id="wishlistView" class="hidden">
                <div class="flex justify-between items-center mb-8">
                    <div class="w-44"></div>
                    <h2 class="font-black text-2xl uppercase tracking-widest italic text-amber-400 text-center">Book Wishlist 🪄</h2>
                    <input id="filterWishlist" type="text" oninput="render()" placeholder="Filter wishlist..." class="col-filter">
                </div>
                <div id="col-wishlist" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const GOOGLE_BOOKS_KEY = 'AIzaSyDXwLuSlheMRhIZPqX8J88MKbZRV7rcwws';

        let allBooks = [], editingId = null, currentViewMode = 'queue';

        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(); else showAuth();
            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) showApp(); else showAuth();
            });
        }

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
            if (error) alert("OAuth error: " + error.message);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            showAuth();
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadBooks();
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        async function loadBooks() { 
            let { data, error } = await supabaseClient.from('books').select('*').order('title', { ascending: true }); 
            if (!error) { 
                allBooks = data || []; 
                render(); 
            } 
        }

        function toggleType(t) { 
            document.getElementById('i-book').classList.toggle('active', true);
        }

        function parseReleaseYear(val) {
            if (val === undefined || val === null || val === 'null' || val === 'undefined' || val === '') return 'TBA';
            if (typeof val === 'number' && val > 1000 && val < 3000) return val.toString();
            if (typeof val === 'string' && /^\d{4}$/.test(val.trim())) return val.trim();
            if (typeof val === 'string' && val.includes('-')) {
                const yearPart = val.split('-')[0];
                if (yearPart.length === 4 && !isNaN(yearPart)) return yearPart;
            }
            let num = Number(val);
            if (!isNaN(num) && num > 0) {
                if (num > 32503680000) num = Math.floor(num / 1000);
                const dateObj = new Date(num * 1000);
                if (!isNaN(dateObj.getFullYear())) return dateObj.getFullYear().toString();
            }
            return 'TBA';
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const aIn = document.getElementById('authorInput');
            const sIn = document.getElementById('seriesInput');
            const snIn = document.getElementById('seriesNumInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const genre = tIn.dataset.genre || '';
                const releaseYear = tIn.dataset.release || '';
                const series = sIn.value.trim() || null;
                const seriesNum = snIn.value ? parseFloat(snIn.value) : null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'To Read';

                if (editingId) {
                    const cur = allBooks.find(b => b.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(), 
                        author: aIn.value.trim() || 'Unknown',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover || cur.cover_url, 
                        genre: genre || cur.genre,
                        release_date: releaseYear || cur.release_date
                    };
                    
                    const { error } = await supabaseClient.from('books').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('books').insert([{ 
                        title: tIn.value.trim(), 
                        author: aIn.value.trim() || 'Unknown',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover, 
                        genre: genre || 'Book', 
                        release_date: releaseYear, 
                        status: defaultStatus
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadBooks();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving book: ${err.message || 'Check database settings'}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 
            delete tIn.dataset.genre; 
            delete tIn.dataset.release; 

            document.getElementById('authorInput').value = '';
            document.getElementById('seriesInput').value = ''; 
            document.getElementById('seriesNumInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('seriesResults').classList.add('hidden');
            document.getElementById('seriesResults').innerHTML = '';

            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "Search"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
            document.getElementById('deleteSelectedBtn').classList.add('hidden');
        }

        function render() {
            const fM = document.getElementById('filterMain').value.toLowerCase();
            const fA = document.getElementById('filterAlt').value.toLowerCase();
            const fW = document.getElementById('filterWishlist') ? document.getElementById('filterWishlist').value.toLowerCase() : '';

            const cols = { 
                reading: document.getElementById('col-reading'), 
                main: document.getElementById('col-main'),
                alt: document.getElementById('col-alt'),
                wishlist: document.getElementById('col-wishlist')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });

            const sortedList = [...allBooks].sort((a, b) => a.title.localeCompare(b.title));

            if (currentViewMode === 'queue') {
                const activeBooks = sortedList.filter(b => b.status === 'Reading');
                if (activeBooks.length > 0) {
                    activeBooks.forEach(b => cols.reading.appendChild(createActiveCard(b)));
                } else {
                    cols.reading.innerHTML = `<p class="text-slate-500 text-sm font-semibold italic">Nothing currently being read</p>`;
                }
                
                sortedList.filter(b => !['Reading', 'Finished', 'Wishlist', 'Not Interested'].includes(b.status))
                    .filter(b => b.title.toLowerCase().includes(fM) || (b.author && b.author.toLowerCase().includes(fM)) || (b.series && b.series.toLowerCase().includes(fM)))
                    .forEach(b => cols.main.appendChild(createCard(b)));

            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Finished' : 'Not Interested';
                sortedList.filter(b => b.status === target)
                    .filter(b => b.title.toLowerCase().includes(fA) || (b.author && b.author.toLowerCase().includes(fA)))
                    .forEach(b => cols.alt.appendChild(createCard(b)));

            } else if (currentViewMode === 'wishlist') {
                sortedList.filter(b => b.status === 'Wishlist')
                    .filter(b => b.title.toLowerCase().includes(fW) || (b.author && b.author.toLowerCase().includes(fW)))
                    .forEach(b => cols.wishlist.appendChild(createCard(b)));
            }
        }

        function createActiveCard(book) {
            const hasSeries = Boolean(book.series && book.series.trim() !== '');
            const releaseYear = parseReleaseYear(book.release_date);
            const seriesLabel = hasSeries ? `${book.series}${book.series_num ? ' #' + book.series_num : ''}` : '';

            const activeBadgeStyle = hasSeries
                ? 'text-amber-400 bg-amber-950/40 border-amber-800/40'
                : 'text-amber-400 bg-amber-950/40 border-amber-800/40';

            const div = document.createElement('div');
            div.className = "flex items-center gap-4 bg-[#1e293b]/50 p-3 rounded-xl border border-slate-700/50 relative w-full";
            
            div.innerHTML = `
                <img src="${book.cover_url || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${book.title}" class="w-16 h-22 object-cover rounded-md shadow-md flex-shrink-0 bg-slate-900" />
                <div class="flex flex-col gap-1 flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        ${hasSeries ? `<span class="text-[9px] font-bold ${activeBadgeStyle} px-2 py-0.5 rounded border truncate max-w-[140px]">⚡ ${seriesLabel}</span>` : `<span class="text-[9px] font-bold ${activeBadgeStyle} px-2 py-0.5 rounded border truncate">📚 STANDALONE</span>`}
                        
                        <div class="relative group/menu">
                            <button class="p-1 rounded hover:bg-slate-700/60 text-slate-400 hover:text-white transition-colors" title="Change Status">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </button>
                            
                            <div class="absolute right-0 top-full mt-1 hidden group-hover/menu:flex items-center gap-1 bg-[#0f172a] border border-amber-900/80 p-1.5 rounded-lg shadow-xl z-50">
                                <button onclick="updateStatus(${book.id}, 'To Read')" class="p-1.5 rounded hover:bg-amber-500/20 text-amber-400 transition-colors" title="Move to Collection (📚)">📚</button>
                                <button onclick="updateStatus(${book.id}, 'Finished')" class="p-1.5 rounded hover:bg-emerald-500/20 text-emerald-400 transition-colors" title="Mark Finished (🏆)">🏆</button>
                            </div>
                        </div>
                    </div>
                    <h4 class="font-bold text-slate-100 text-sm truncate leading-tight">${book.title}</h4>
                    <span class="text-xs text-slate-400">by ${book.author || 'Unknown'} • ${releaseYear}</span>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-[9px] bg-amber-900/60 text-amber-300 px-1.5 py-0.5 rounded uppercase font-semibold">📖 READING</span>
                    </div>
                </div>
            `;
            return div;
        }

        function createCard(book) {
            const hasSeries = Boolean(book.series && book.series.trim() !== '');
            const releaseYear = parseReleaseYear(book.release_date);
            const seriesLabel = hasSeries ? `${book.series}${book.series_num ? ' #' + book.series_num : ''}` : '';

            const div = document.createElement('div');
            div.dataset.id = book.id; 
            div.dataset.series = book.series || '';
            div.className = `book-card flex flex-col justify-between w-full`;
            
            const topBarColor = hasSeries ? 'bg-amber-500' : 'bg-amber-400';
            const badgeStyle = 'bg-amber-600/20 text-amber-400 border-amber-500/30';

            div.innerHTML = `
                <div>
                    <div class="h-1.5 w-full ${topBarColor}"></div>
                    <div class="p-2.5 pb-1 flex flex-col items-center">
                        <div class="relative w-full flex justify-center bg-slate-900 rounded-lg overflow-hidden">
                            <img src="${book.cover_url || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${book.title}">
                        </div>
                        <div class="mt-2 mb-1 w-full text-left">
                            ${hasSeries ? `<span class="inline-block text-[9px] ${badgeStyle} border px-1.5 py-0.5 rounded font-bold uppercase truncate max-w-full">⚡ ${seriesLabel}</span>` : `<span class="inline-block text-[9px] ${badgeStyle} border px-1.5 py-0.5 rounded font-bold uppercase truncate max-w-full">📚 Standalone</span>`}
                        </div>
                        <div class="flex justify-between items-start gap-1.5 w-full">
                            <h3 class="font-bold text-sm text-white leading-snug line-clamp-2 text-left">${book.title}</h3>
                            <button onclick='editL(${JSON.stringify(book).replace(/'/g, "&apos;")})' title="Edit" class="text-slate-400 hover:text-amber-400 font-bold text-sm leading-none p-0.5 transition">✏️</button>
                        </div>
                        <p class="text-xs text-amber-400 font-bold mt-0.5 text-left w-full truncate">by ${book.author || 'Unknown'}</p>
                        <p class="text-[11px] text-slate-400 text-left w-full">${releaseYear}</p>
                        <div class="flex flex-wrap gap-1 mt-2 w-full">
                            <span class="type-badge shadow-sm">BOOK</span>
                        </div>
                    </div>
                </div>
                <div class="px-2.5 pb-2 mt-1 flex flex-col gap-1 text-xs border-t border-slate-800/80 pt-1.5">
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-amber-400 font-bold uppercase text-[10px] truncate min-w-0 flex-1 text-left">${book.genre || 'Book'}</span>
                        <select onchange="updateStatus(${book.id}, this.value)" class="bg-slate-900 text-[10px] py-0.5 px-1 rounded border border-slate-700 text-white font-bold outline-none cursor-pointer w-auto max-w-[110px]">
                            <option value="To Read" ${book.status === 'To Read' ? 'selected' : ''}>To Read 📚</option>
                            <option value="Reading" ${book.status === 'Reading' ? 'selected' : ''}>Reading 📖</option>
                            <option value="Wishlist" ${book.status === 'Wishlist' ? 'selected' : ''}>Wishlist 🪄</option>
                            <option value="Finished" ${book.status === 'Finished' ? 'selected' : ''}>Finished 🏆</option>
                            <option value="Not Interested" ${book.status === 'Not Interested' ? 'selected' : ''}>Trash 🗑️</option>
                        </select>
                    </div>
                </div>
            `;
            return div;
        }

        function toggleView(v) { 
            currentViewMode = v;
            const qv = document.getElementById('queueView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'queue') {
                dt.style.display = 'grid'; qv.style.display = 'block'; as.style.display = 'flex'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                qv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; qv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Finished Archive 🏆' : 'Book Scrap Yard 🗑️';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editL(b) { 
            editingId = b.id; 
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            dt.style.display = 'grid';
            
            if (currentViewMode !== 'queue') {
                as.style.display = 'none';
                ia.classList.remove('lg:col-span-7');
                ia.classList.add('lg:col-span-12');
            }

            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = b.title; 
            if (b.cover_url) tIn.dataset.img = b.cover_url;
            if (b.genre) tIn.dataset.genre = b.genre;
            if (b.release_date) tIn.dataset.release = b.release_date;

            document.getElementById('formModeLabel').innerText = "Updating: " + b.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
            document.getElementById('deleteSelectedBtn').classList.remove('hidden');
            
            document.getElementById('authorInput').value = b.author || '';
            document.getElementById('seriesInput').value = b.series || ''; 
            document.getElementById('seriesNumInput').value = b.series_num || ''; 
        }

        function exitEditMode() { resetForm(); toggleView(currentViewMode); }

        async function deleteSelectedFromForm() {
            if (!editingId) return;
            if (confirm("Are you sure you want to delete this book?")) {
                await supabaseClient.from('books').delete().eq('id', editingId);
                resetForm();
                loadBooks();
            }
        }

        async function updateStatus(id, s) { await supabaseClient.from('books').update({ status:s }).eq('id', id); loadBooks(); }

        function filterSeriesDropdown(val) {
            const sr = document.getElementById('seriesResults');
            const existingSeries = Array.from(new Set(allBooks.map(b => b.series).filter(s => s && s.trim() !== '')));
            const filtered = existingSeries.filter(s => s.toLowerCase().includes(val.toLowerCase().trim()));

            if (filtered.length === 0) { sr.classList.add('hidden'); return; }
            sr.innerHTML = filtered.map(s => `<div onclick="selectSeries('${s.replace(/'/g, "\\'")}')" class="p-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700/60 text-left text-white font-bold text-xs truncate transition-colors">${s}</div>`).join('');
            sr.classList.remove('hidden');
        }

        function selectSeries(name) {
            document.getElementById('seriesInput').value = name;
            document.getElementById('seriesResults').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#seriesInput') && !e.target.closest('#seriesResults')) { document.getElementById('seriesResults').classList.add('hidden'); }
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) { document.getElementById('searchResults').classList.add('hidden'); }
        });

        async function searchBooks(q) { 
            const r = document.getElementById('searchResults'); 
            const trimmedQuery = q ? q.trim() : '';

            if (trimmedQuery.length < 2) { r.classList.add('hidden'); r.innerHTML = ''; return; } 

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(trimmedQuery)}&key=${GOOGLE_BOOKS_KEY}`);
                const data = await response.json();

                if (!data.items || data.items.length === 0) { r.innerHTML = `<div class="p-4 text-sm text-slate-400">No results found.</div>`; r.classList.remove('hidden'); return; }

                r.innerHTML = data.items.map(item => {
                    const info = item.volumeInfo;
                    const title = (info.title || '').replace(/"/g, '&quot;');
                    const author = (info.authors ? info.authors.join(', ') : 'Unknown').replace(/"/g, '&quot;');
                    const cover = info.imageLinks?.thumbnail ? info.imageLinks.thumbnail.replace('http:', 'https:') : '';
                    const genre = (info.categories ? info.categories[0] : 'Book').replace(/"/g, '&quot;');
                    const releaseYear = info.publishedDate ? info.publishedDate.split('-')[0] : '';
                    
                    return `
                        <div onclick="selectBook(&quot;${title}&quot;, &quot;${author}&quot;, &quot;${cover}&quot;, &quot;${genre}&quot;, &quot;${releaseYear}&quot;)" 
                             class="p-3 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors">
                            ${cover ? `<img src="${cover}" class="w-10 h-14 object-cover rounded shadow bg-slate-900">` : '<div class="w-10 h-14 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'}
                            <div>
                                <p class="text-sm font-bold text-white">${info.title}</p>
                                <p class="text-xs text-amber-400 font-bold uppercase mt-0.5">by ${author} • ${releaseYear || 'TBA'}</p>
                            </div>
                        </div>
                    `;
                }).join(''); 
                r.classList.remove('hidden');
            } catch (err) {
                r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Network error: ${err.message}</div>`;
                r.classList.remove('hidden');
            }
        }

        function selectBook(t, a, c, g, r) { 
            const tIn = document.getElementById('titleInput'); 
            tIn.value = t; 
            document.getElementById('searchResults').classList.add('hidden'); 
            if (c) tIn.dataset.img = c;
            if (g) tIn.dataset.genre = g;
            if (r) tIn.dataset.release = r;
            
            document.getElementById('authorInput').value = a;
            document.getElementById('seriesInput').focus();
        }

        function downloadTemplate() { const csv = "title,author,series,series_num,genre,status,cover_url\nDune,Frank Herbert,Dune Chronicles,1,Sci-Fi,To Read,http://books.google.com/books/content?id=B1hSG45BZegC&printsec=frontcover&img=1&zoom=1"; const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'books_template.csv'; a.click(); }
        document.getElementById('csvFile').addEventListener('change', function(e) { const r = new FileReader(); r.onload = async (ev) => { const rows = ev.target.result.split('\n').slice(1); const bToInsert = rows.map(r => { const cols = r.split(',').map(x => x?.trim()); if (cols[0]) return { title: cols[0], author: cols[1]||'Unknown', series: cols[2]||null, series_num: cols[3]?parseFloat(cols[3]):null, genre: cols[4]||'Book', status: cols[5]||'To Read', cover_url: cols[6]||'' }; }).filter(x => x); await supabaseClient.from('books').insert(bToInsert); loadBooks(); }; r.readAsText(e.target.files[0]); });

        initAuth();
    </script>
</body>
</html>
