<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
        .media-card { background-color: #1e293b; border-radius: 0.75rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s, box-shadow 0.2s; }
        .media-card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        /* Fixed Aspect Ratio and Object Contain to Prevent Distortion */
        .media-card img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background-color: #0f172a; padding: 4px; }
        #authScreen { background-color: #0b0f19; position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .col-filter { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 99px; padding: 4px 16px; font-size: 11px; outline: none; width: 180px; color: white; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">

    <!-- Google Auth Screen -->
    <div id="authScreen">
        <div class="bg-slate-800 p-10 rounded-[3rem] border border-slate-700 shadow-2xl w-full max-w-sm text-center">
            <div class="mb-2 text-indigo-400 text-6xl font-black italic tracking-tighter uppercase leading-none text-white">Vault</div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-8">Books Portal Authentication</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 px-6 rounded-2xl font-black hover:bg-slate-100 transition flex items-center justify-center gap-3 uppercase tracking-wider text-sm shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" style="display: none;">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-6 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <button onclick="window.history.back()" title="Page Back" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">⬅️</button>
                   <button onclick="window.location.href='games.html'" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</button>
                   <button onclick="toggleView('queue')" id="btn-queue" title="Books Vault" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg">📚</button>
                   <button onclick="window.location.href='movies.html'" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</button>
                   <button onclick="logout()" title="Sign Out" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 id="pageHeaderTitle" class="text-3xl font-black tracking-tighter text-indigo-500 uppercase italic">Books Vault</h1>
                <div class="flex items-center gap-2">
                    <button onclick="toggleView('wishlist')" id="btn-wishlist" title="Wishlist" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-purple-600">🎁</button>
                    <div class="relative group">
                        <button class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="hidden group-hover:flex flex-col gap-2 absolute left-0 top-full mt-2 p-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50">
                            <button onclick="downloadTemplate()" title="CSV Template" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">💾</button>
                            <button onclick="document.getElementById('csvFile').click()" title="Import CSV" class="p-2 bg-slate-700 rounded-lg text-xl hover:bg-slate-600">📥</button>
                        </div>
                    </div>
                    <button onclick="toggleView('archive')" id="btn-archive" title="Trophy Room (Read)" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <!-- Dual Card Section -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
                
                <!-- Left Card: Currently Reading / Active Session -->
                <div class="lg:col-span-5 bg-slate-900/60 border border-slate-800/80 rounded-[2rem] p-6 flex flex-col justify-between min-h-[220px]">
                    <div class="text-xs font-black italic uppercase tracking-wider text-indigo-400 mb-3">CURRENTLY READING</div>
                    <div id="activeSessionContainer" class="flex-1 flex items-center justify-center">
                        <p class="text-slate-500 text-sm font-semibold italic">No book active</p>
                    </div>
                </div>

                <!-- Right Card: Database Search / Entry -->
                <div class="lg:col-span-7 bg-slate-900/60 border border-slate-800/80 rounded-[2rem] p-6 flex flex-col gap-4">
                    <div class="text-[11px] font-black italic uppercase tracking-widest text-indigo-400">DATABASE SEARCH / ENTRY</div>
                    
                    <div class="relative">
                        <input id="apiSearchInput" type="text" placeholder="Search for book title..." onkeypress="if(event.key==='Enter') searchGoogleBooks()" class="w-full bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
                        <button onclick="searchGoogleBooks()" class="absolute right-3 top-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs px-4 py-2 rounded-xl transition">SEARCH API</button>
                    </div>

                    <div id="searchResultsDropdown" class="hidden max-h-48 overflow-y-auto bg-[#0b0f19] border border-slate-800 rounded-xl p-2 flex flex-col gap-2"></div>

                    <div class="flex gap-3 mt-1">
                        <input id="manualAuthor" type="text" placeholder="Author / Series Name" class="flex-1 bg-[#0b0f19] border border-slate-800/80 rounded-2xl p-4 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
                        <button onclick="commitManualBook()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs tracking-widest px-8 rounded-2xl transition shadow-lg">COMMIT</button>
                    </div>
                </div>

            </div>

            <!-- Library Filter Controls -->
            <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-800/60 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
                <input id="bookSearch" type="text" oninput="render()" placeholder="Filter library by title..." class="w-full sm:w-2/3 bg-[#0b0f19] p-3 rounded-xl border border-slate-800 text-white text-xs outline-none">
                <input id="filterCategory" type="text" oninput="render()" placeholder="Filter genre..." class="col-filter py-2 w-full sm:w-auto">
            </div>

            <!-- Bookshelf Grid Container -->
            <div id="bookshelfGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-4"></div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const GOOGLE_BOOKS_API_KEY = 'AIzaSyDXwLuSlheMRhIZPqX8J88MKbZRV7rcwws';

        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let allBooks = [];
        let currentView = 'queue';

        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) showApp(); else showAuth();
            supabaseClient.auth.onAuthStateChange((_e, s) => { if (s) showApp(); else showAuth(); });
        }

        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
            if (error) alert(error.message);
        }

        async function logout() { await supabaseClient.auth.signOut(); showAuth(); }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadBooks();
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        async function loadBooks() {
            let { data, error } = await supabaseClient.from('books').select('*');
            if (!error) { allBooks = data || []; render(); updateActiveSession(); }
        }

        function updateActiveSession() {
            const activeContainer = document.getElementById('activeSessionContainer');
            const activeBook = allBooks.find(b => b.status === 'Reading');

            if (activeBook) {
                activeContainer.innerHTML = `
                    <div class="flex items-center gap-4 w-full">
                        <img src="${activeBook.cover_url || 'https://via.placeholder.com/150x225?text=No+Cover'}" class="w-14 h-20 object-contain rounded-xl border border-slate-700 bg-slate-950 p-1">
                        <div>
                            <h4 class="font-black text-white text-base leading-tight">${activeBook.title}</h4>
                            <p class="text-xs text-slate-400 mt-1">${activeBook.author || 'Unknown Author'}</p>
                            <span class="inline-block mt-2 text-[10px] bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 px-2 py-0.5 rounded-md font-bold uppercase">${activeBook.genre || 'Book'}</span>
                        </div>
                    </div>
                `;
            } else {
                activeContainer.innerHTML = `<p class="text-slate-500 text-sm font-semibold italic">No book active</p>`;
            }
        }

        function toggleView(mode) {
            currentView = mode;
            const btnQ = document.getElementById('btn-queue');
            const btnA = document.getElementById('btn-archive');
            const btnW = document.getElementById('btn-wishlist');
            const title = document.getElementById('pageHeaderTitle');

            btnQ.className = "bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700";
            btnA.className = "bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600";
            btnW.className = "bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-purple-600";

            if (mode === 'archive') {
                btnA.className = "bg-emerald-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg";
                title.innerText = "Books Trophy Room";
                title.className = "text-3xl font-black tracking-tighter text-emerald-400 uppercase italic";
            } else if (mode === 'wishlist') {
                btnW.className = "bg-purple-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg";
                title.innerText = "Books Wishlist";
                title.className = "text-3xl font-black tracking-tighter text-purple-400 uppercase italic";
            } else {
                btnQ.className = "bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg";
                title.innerText = "Books Vault";
                title.className = "text-3xl font-black tracking-tighter text-indigo-500 uppercase italic";
            }
            render();
        }

        async function updateStatus(id, newStatus) {
            await supabaseClient.from('books').update({ status: newStatus }).eq('id', id);
            loadBooks();
        }

        async function deleteBook(id) {
            if (confirm("Are you sure you want to delete this book?")) {
                await supabaseClient.from('books').delete().eq('id', id);
                loadBooks();
            }
        }

        function render() {
            const query = document.getElementById('bookSearch').value.toLowerCase();
            const genre = document.getElementById('filterCategory').value.toLowerCase();
            const grid = document.getElementById('bookshelfGrid');
            grid.innerHTML = '';

            allBooks
                .filter(b => {
                    if (currentView === 'archive') return b.status === 'Read';
                    if (currentView === 'wishlist') return b.status === 'Wishlist';
                    return b.status !== 'Read' && b.status !== 'Wishlist';
                })
                .filter(b => (b.title || '').toLowerCase().includes(query) || (b.author || '').toLowerCase().includes(query))
                .filter(b => (b.genre || '').toLowerCase().includes(genre))
                .forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'media-card p-2.5 flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <img src="${book.cover_url || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${book.title}">
                            <div class="flex justify-between items-start gap-1.5 mt-2">
                                <h3 class="font-bold text-xs text-white leading-tight line-clamp-2">${book.title}</h3>
                                <button onclick="deleteBook(${book.id})" title="Delete Book" class="text-slate-500 hover:text-red-400 font-bold text-sm leading-none p-0.5 transition">✕</button>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">${book.author || 'Unknown Author'}</p>
                        </div>
                        <div class="mt-2 flex justify-between items-center text-[10px]">
                            <span class="text-indigo-400 font-bold uppercase truncate max-w-[55px]">${book.genre || 'Book'}</span>
                            <select onchange="updateStatus(${book.id}, this.value)" class="bg-slate-900 text-[10px] py-0.5 px-1 rounded border border-slate-700 text-white font-bold outline-none cursor-pointer">
                                <option value="Bookshelf" ${book.status !== 'Reading' && book.status !== 'Read' && book.status !== 'Wishlist' ? 'selected' : ''}>Bookshelf</option>
                                <option value="Reading" ${book.status === 'Reading' ? 'selected' : ''}>Reading</option>
                                <option value="Wishlist" ${book.status === 'Wishlist' ? 'selected' : ''}>Wishlist 🎁</option>
                                <option value="Read" ${book.status === 'Read' ? 'selected' : ''}>Read 🏆</option>
                            </select>
                        </div>
                    `;
                    grid.appendChild(card);
                });
        }

        async function searchGoogleBooks() {
            const query = document.getElementById('apiSearchInput').value;
            if (!query) return;
            const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&key=${GOOGLE_BOOKS_API_KEY}`);
            const data = await res.json();
            const dropdown = document.getElementById('searchResultsDropdown');
            dropdown.innerHTML = '';

            if (data.items) {
                dropdown.classList.remove('hidden');
                data.items.forEach(item => {
                    const info = item.volumeInfo;
                    const cover = info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : '';
                    const title = info.title || 'Untitled';
                    const author = info.authors ? info.authors.join(', ') : 'Unknown';
                    const genre = info.categories ? info.categories[0] : 'General';

                    const el = document.createElement('div');
                    el.className = 'flex items-center justify-between bg-slate-800/80 p-2 rounded-xl border border-slate-700/50 hover:border-indigo-500 cursor-pointer';
                    el.onclick = () => addBookFromApi(title, author, genre, cover);
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${cover || 'https://via.placeholder.com/150x225?text=No+Cover'}" class="w-8 h-10 object-contain rounded bg-slate-950">
                            <div>
                                <h5 class="text-xs font-bold text-white leading-tight">${title}</h5>
                                <p class="text-[10px] text-slate-400">${author}</p>
                            </div>
                        </div>
                        <span class="text-[10px] bg-indigo-600 px-2 py-1 rounded text-white font-bold uppercase">Add</span>
                    `;
                    dropdown.appendChild(el);
                });
            }
        }

        async function addBookFromApi(title, author, genre, cover_url) {
            await supabaseClient.from('books').insert([{ title, author, genre, cover_url, status: 'Bookshelf' }]);
            document.getElementById('searchResultsDropdown').classList.add('hidden');
            document.getElementById('apiSearchInput').value = '';
            loadBooks();
        }

        async function commitManualBook() {
            const title = document.getElementById('apiSearchInput').value;
            const author = document.getElementById('manualAuthor').value;
            if (!title) return alert('Please enter a book title');
            await supabaseClient.from('books').insert([{ title, author, status: 'Bookshelf' }]);
            document.getElementById('apiSearchInput').value = '';
            document.getElementById('manualAuthor').value = '';
            loadBooks();
        }

        function downloadTemplate() {
            const csv = "title,author,genre,status,cover_url\nThe Hobbit,J.R.R. Tolkien,Fantasy,Read,https://via.placeholder.com/150x225";
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'books_template.csv'; a.click();
        }

        initAuth();
    </script>
</body>
</html>
