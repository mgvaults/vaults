<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Vault</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <script>
    window.tailwind = { config: { suppressDeprecationWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>

<body class="bg-slate-900 min-h-screen p-2 sm:p-4 font-sans text-left overflow-x-hidden">
    <div id="mainApp">
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center py-4 mb-8 border-b border-slate-800 text-white">
                <div class="flex items-center gap-2">
                   <a href="dashboard.html" title="Home Dashboard" class="bg-indigo-600 p-2.5 px-4 rounded-xl text-2xl shadow-lg flex items-center justify-center hover:bg-indigo-500">🏠</a>
                   <a href="games.html" title="Games Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎮</a>
                   <a href="movies.html" title="Movies Vault" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🎬</a>
                   <button onclick="handleLogout()" title="Lock Vault / Logout" class="bg-slate-800 p-2.5 px-4 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🔒</button>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-amber-500 uppercase italic">Books Vault</h1>
                <div class="flex items-center gap-2">
                    <div class="toolbox-dropdown">
                        <button title="Toolbox" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-slate-700">🧰</button>
                        <div class="toolbox-menu">
                            <button id="repairBtn" onclick="repairSortOrder()" class="toolbox-item text-amber-400">
                                <span>🔧</span> Repair Sorting
                            </button>
                            <button onclick="downloadTemplate()" class="toolbox-item">
                                <span>💾</span> CSV Template
                            </button>
                            <button onclick="document.getElementById('csvFile').click()" class="toolbox-item">
                                <span>📥</span> Import CSV
                            </button>
                        </div>
                    </div>
                    <button onclick="toggleView('wishlist')" title="Wishlist" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-amber-400">🪄</button>
                    <button onclick="toggleView('archive')" title="Archive / Finished" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-emerald-600">🏆</button>
                    <button onclick="toggleView('trash')" title="Trash" class="p-2.5 px-4 bg-slate-800 rounded-xl border border-slate-700 text-2xl hover:bg-rose-600">🗑️</button>
                </div>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </header>

            <div id="dashboardTop" class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                <div id="activeSessionBox" class="lg:col-span-5 bg-amber-950/20 p-6 rounded-[2.5rem] border border-amber-500/20 shadow-inner">
                    <h2 class="text-amber-400 font-black text-sm uppercase tracking-widest mb-5 flex items-center gap-3 italic justify-center text-center text-white">Currently Reading</h2>
                    <div id="col-reading" class="space-y-5"></div>
                </div>
                <div id="inputArea" class="lg:col-span-7 bg-slate-800 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl relative">
                    <div class="flex flex-col gap-4 relative">
                        <div class="text-[10px] font-black text-amber-400 uppercase px-1 italic flex justify-between">
                            <span id="formModeLabel">Google Books Search / Entry</span>
                            <button id="cancelEdit" onclick="exitEditMode()" class="hidden text-red-400">Cancel Edit</button>
                        </div>
                        <input id="titleInput" type="text" oninput="searchBooks(this.value)" placeholder="Search for book title or ISBN..." class="w-full bg-slate-900 p-5 rounded-2xl outline-none border border-slate-700 text-white text-base">
                        <div id="searchResults" class="hidden absolute top-[110px] left-0 right-0 bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl overflow-y-auto max-h-[400px] z-50 text-white"></div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input id="authorInput" type="text" placeholder="Author Name" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            <input id="genreInput" type="text" placeholder="Genre (e.g., Fantasy, Sci-Fi)" class="bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                        </div>

                        <div class="flex gap-3 text-white relative">
                            <div class="flex-1 flex gap-2">
                                <input id="seriesInput" type="text" placeholder="Book Series Name" class="w-full bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold italic">
                                <input id="seriesNumInput" type="number" step="0.1" placeholder="Book #" class="w-24 bg-slate-900 p-4 rounded-2xl text-white border border-slate-700 text-sm font-bold">
                            </div>
                            <button onclick="submitForm()" id="submitBtn" class="bg-amber-600 px-10 rounded-2xl font-black uppercase text-sm text-white hover:bg-amber-500">Commit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="shelfView">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-slate-400 font-black text-sm uppercase tracking-[0.4em]">Bookshelf & Reading Queue</h2>
                    <input id="filterShelf" type="text" oninput="render()" placeholder="Filter books..." class="col-filter">
                </div>
                <div id="col-shelf" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 min-h-[450px]"></div>
            </div>

            <div id="altView" class="hidden">
                <div class="flex justify-between items-center mb-10">
                    <div class="w-44"></div>
                    <h2 id="altTitle" class="font-black text-2xl uppercase tracking-widest italic text-white text-center">Archive</h2>
                    <input id="filterAlt" type="text" oninput="render()" placeholder="Filter books..." class="col-filter">
                </div>
                <div id="col-alt" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
            </div>

            <div id="wishlistView" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-amber-400 font-black text-3xl uppercase tracking-widest italic">Book Wishlist</h2>
                </div>
                <div id="col-wishlist" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://zioiamijgblwxlfevcdr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb2lhbWlqZ2Jsd3hsZmV2Y2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjgwNTYsImV4cCI6MjA5MjU0NDA1Nn0.AoTc_GhRLu1GZhF7sH0h2xVhnIcpDVwmBg5PA7zXL-o';
        const GOOGLE_BOOKS_KEY = 'AIzaSyDXwLuSlheMRhIZPqX8J88MKbZRV7rcwws';

        let allBooks = [], editingId = null, currentViewMode = 'shelf';

        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
        });

        async function loadBooks() { 
            let { data, error } = await supabaseClient.from('books').select('*').order('sort_order', { ascending: true }); 
            if (!error) { 
                allBooks = data || []; 
                render(); 
            } 
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const tIn = document.getElementById('titleInput');
            const aIn = document.getElementById('authorInput');
            const gIn = document.getElementById('genreInput');
            const sIn = document.getElementById('seriesInput');
            const snIn = document.getElementById('seriesNumInput');
            
            if (!tIn.value.trim()) return;
            submitBtn.disabled = true;

            try {
                const cover = tIn.dataset.img || '';
                const series = sIn.value.trim() || null;
                const seriesNum = snIn.value ? parseFloat(snIn.value) : null;
                let defaultStatus = currentViewMode === 'wishlist' ? 'Wishlist' : 'To Read';

                if (editingId) {
                    const cur = allBooks.find(b => b.id === editingId);
                    const payload = { 
                        title: tIn.value.trim(),
                        author: aIn.value.trim() || 'Unknown',
                        genre: gIn.value.trim() || 'Fiction',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover || cur.cover_url
                    };
                    
                    const { error } = await supabaseClient.from('books').update(payload).eq('id', editingId);
                    if (error) throw error;
                } else {
                    let next = allBooks.length > 0 ? Math.max(...allBooks.map(b => b.sort_order)) + 100 : 100;
                    const { error } = await supabaseClient.from('books').insert([{ 
                        title: tIn.value.trim(), 
                        author: aIn.value.trim() || 'Unknown',
                        genre: gIn.value.trim() || 'Fiction',
                        series, 
                        series_num: seriesNum,
                        cover_url: cover, 
                        status: defaultStatus, 
                        sort_order: next 
                    }]);
                    if (error) throw error;
                }

                resetForm(); 
                await loadBooks();

            } catch (err) {
                console.error("Save failed:", err);
                alert(`Error saving book: ${err.message || 'Check database table standard'}`);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function resetForm() { 
            editingId = null;
            const tIn = document.getElementById('titleInput'); 
            tIn.value = ''; 
            delete tIn.dataset.img; 

            document.getElementById('authorInput').value = '';
            document.getElementById('genreInput').value = '';
            document.getElementById('seriesInput').value = ''; 
            document.getElementById('seriesNumInput').value = ''; 
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';

            document.getElementById('submitBtn').innerText = "Commit"; 
            document.getElementById('formModeLabel').innerText = "Google Books Search / Entry"; 
            document.getElementById('cancelEdit').classList.add('hidden'); 
        }

        function render() {
            const fS = document.getElementById('filterShelf').value.toLowerCase();
            const fA = document.getElementById('filterAlt').value.toLowerCase();

            const cols = { 
                reading: document.getElementById('col-reading'), 
                shelf: document.getElementById('col-shelf'), 
                alt: document.getElementById('col-alt'), 
                wishlist: document.getElementById('col-wishlist')
            };
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ''; });

            if (currentViewMode === 'shelf') {
                allBooks.filter(b => b.status === 'Reading').forEach(b => cols.reading.appendChild(createCard(b)));
                
                allBooks.filter(b => b.status === 'To Read')
                    .filter(b => b.title.toLowerCase().includes(fS) || (b.author && b.author.toLowerCase().includes(fS)) || (b.series && b.series.toLowerCase().includes(fS)))
                    .forEach(b => cols.shelf.appendChild(createCard(b)));
            } else if (currentViewMode === 'archive' || currentViewMode === 'trash') {
                const target = currentViewMode === 'archive' ? 'Finished' : 'Not Interested';
                allBooks.filter(b => b.status === target)
                    .filter(b => b.title.toLowerCase().includes(fA) || (b.author && b.author.toLowerCase().includes(fA)))
                    .forEach(b => cols.alt.appendChild(createCard(b)));
            } else if (currentViewMode === 'wishlist') {
                allBooks.filter(b => b.status === 'Wishlist')
                    .forEach(b => cols.wishlist.appendChild(createCard(b)));
            }
        }

        function createCard(book) {
            const isS = book.series && book.series.trim() !== '';
            
            const div = document.createElement('div');
            div.dataset.id = book.id; 
            div.className = `game-card border border-slate-700 shadow-xl relative mb-4 ${isS ? 'series-chained' : ''}`;

            div.innerHTML = `
                <img src="${book.cover_url || ''}" class="game-card-cover border-r border-slate-700 shadow-inner" alt="${book.title}">
                <div class="p-4 flex-1 flex flex-col justify-between overflow-hidden text-white">
                    <div class="flex justify-between items-start text-white">
                        <div class="text-left flex-1 min-w-0 pr-2">
                            <h3 class="font-black text-[18px] leading-tight text-white clamp-2">${book.title}</h3>
                            <p class="text-xs text-amber-400 font-bold mt-1">by ${book.author || 'Unknown'}</p>
                        </div>
                        <div class="flex gap-2 shrink-0 text-white">
                            <button onclick='editBook(${JSON.stringify(book).replace(/'/g, "&apos;")})' class="bg-slate-800 p-2.5 rounded-lg flex items-center justify-center text-base hover:bg-slate-700 transition">✏️</button>
                            <button onclick="deleteBook('${book.id}')" class="bg-slate-800 p-2.5 rounded-lg flex items-center justify-center text-base hover:bg-rose-900 transition">✕</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="flex flex-col min-w-0 pr-2 text-left">
                            ${isS ? `<span class="series-label truncate">${book.series} ${book.series_num ? '#' + book.series_num : ''}</span>` : ''}
                            <span class="genre-label truncate">${book.genre || 'Book'}</span>
                        </div>
                        <select onchange="updateStatus('${book.id}', this.value)" class="bg-slate-900 text-xs py-2 px-4 rounded-xl border border-slate-700 text-white font-black uppercase outline-none cursor-pointer">
                            <option value="To Read" ${book.status === 'To Read' ? 'selected' : ''}>To Read</option>
                            <option value="Reading" ${book.status === 'Reading' ? 'selected' : ''}>Reading</option>
                            <option value="Wishlist" ${book.status === 'Wishlist' ? 'selected' : ''}>Wishlist</option>
                            <option value="Finished" ${book.status === 'Finished' ? 'selected' : ''}>Finished (Archive)</option>
                            <option value="Not Interested" ${book.status === 'Not Interested' ? 'selected' : ''}>Trash</option>
                        </select>
                    </div>
                </div>`;
            return div;
        }

        function toggleView(v) { 
            currentViewMode = v;
            const sv = document.getElementById('shelfView');
            const dt = document.getElementById('dashboardTop');
            const as = document.getElementById('activeSessionBox');
            const ia = document.getElementById('inputArea');
            const av = document.getElementById('altView');
            const wv = document.getElementById('wishlistView');

            if(v === 'shelf') {
                dt.style.display = 'grid'; sv.style.display = 'block'; as.style.display = 'block'; ia.classList.remove('lg:col-span-12'); ia.classList.add('lg:col-span-7');
                av.style.display = 'none'; wv.style.display = 'none';
            } else if(v === 'wishlist') {
                dt.style.display = 'grid'; as.style.display = 'none'; ia.classList.remove('lg:col-span-7'); ia.classList.add('lg:col-span-12');
                sv.style.display = 'none'; av.style.display = 'none'; wv.style.display = 'block';
            } else {
                dt.style.display = 'none'; sv.style.display = 'none'; wv.style.display = 'none'; av.style.display = 'block';
                document.getElementById('altTitle').innerText = v === 'archive' ? 'Finished Archive' : 'Book Scrap Yard';
                document.getElementById('altTitle').style.color = v === 'archive' ? '#34d399' : '#f43f5e';
            }
            render();
        }

        function editBook(b) { 
            editingId = b.id; 
            window.scrollTo({top:0, behavior:'smooth'}); 
            
            const tIn = document.getElementById('titleInput');
            tIn.value = b.title; 
            if (b.cover_url) tIn.dataset.img = b.cover_url;

            document.getElementById('authorInput').value = b.author || '';
            document.getElementById('genreInput').value = b.genre || '';
            document.getElementById('seriesInput').value = b.series || ''; 
            document.getElementById('seriesNumInput').value = b.series_num || ''; 

            document.getElementById('formModeLabel').innerText = "Updating: " + b.title; 
            document.getElementById('cancelEdit').classList.remove('hidden'); 
        }

        function exitEditMode() { resetForm(); toggleView(currentViewMode); }
        async function updateStatus(id, s) { await supabaseClient.from('books').update({ status:s }).eq('id', id); loadBooks(); }
        async function deleteBook(id) { if(confirm('Delete book?')) { await supabaseClient.from('books').delete().eq('id', id); loadBooks(); } }

        async function searchBooks(q) { 
            const r = document.getElementById('searchResults'); 
            const trimmedQuery = q ? q.trim() : '';

            if (trimmedQuery.length < 2) { 
                r.classList.add('hidden'); 
                r.innerHTML = '';
                return; 
            } 

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(trimmedQuery)}&key=${GOOGLE_BOOKS_KEY}`);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    r.innerHTML = `<div class="p-4 text-sm text-slate-400">No books found.</div>`;
                    r.classList.remove('hidden');
                    return;
                }

                r.innerHTML = data.items.map(item => {
                    const info = item.volumeInfo;
                    const title = (info.title || '').replace(/"/g, '&quot;');
                    const author = (info.authors ? info.authors.join(', ') : 'Unknown').replace(/"/g, '&quot;');
                    const cover = info.imageLinks?.thumbnail ? info.imageLinks.thumbnail.replace('http:', 'https:') : '';
                    const genre = (info.categories ? info.categories[0] : 'Fiction').replace(/"/g, '&quot;');
                    
                    return `
                        <div onclick="selectBook(&quot;${title}&quot;, &quot;${author}&quot;, &quot;${cover}&quot;, &quot;${genre}&quot;)" 
                             class="p-4 hover:bg-slate-700 cursor-pointer flex items-center gap-4 border-b border-slate-700/60 text-left text-white font-bold transition-colors">
                            ${cover ? `<img src="${cover}" class="w-12 h-16 object-cover rounded shadow bg-slate-900">` : '<div class="w-12 h-16 bg-slate-900 rounded flex items-center justify-center text-xs text-slate-500">No Cover</div>'}
                            <div>
                                <p class="text-sm font-bold text-white">${info.title}</p>
                                <p class="text-xs text-amber-400 font-normal mt-0.5">by ${author}</p>
                            </div>
                        </div>
                    `;
                }).join(''); 
                
                r.classList.remove('hidden');

            } catch (err) {
                r.innerHTML = `<div class="p-4 text-sm text-rose-400 font-bold">Search error: ${err.message}</div>`;
                r.classList.remove('hidden');
            }
        }

        function selectBook(t, a, c, g) { 
            const tIn = document.getElementById('titleInput'); 
            tIn.value = t; 
            if (c) tIn.dataset.img = c;
            
            document.getElementById('authorInput').value = a;
            document.getElementById('genreInput').value = g;
            document.getElementById('searchResults').classList.add('hidden'); 
            document.getElementById('seriesInput').focus();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#titleInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
