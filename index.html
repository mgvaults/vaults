<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Vaults - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-bold accent-text">My Vaults</h1>
            <button onclick="logOut()" class="bg-red-500/20 text-red-400 hover:bg-red-500/40 px-4 py-2 rounded">Logout</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <a href="games.html" class="glass-panel p-6 rounded-lg text-center hover:bg-slate-700 transition-colors">
                <h2 class="text-2xl font-bold">Games</h2>
            </a>
            <a href="books.html" class="glass-panel p-6 rounded-lg text-center hover:bg-slate-700 transition-colors">
                <h2 class="text-2xl font-bold">Books</h2>
            </a>
            <a href="movies.html" class="glass-panel p-6 rounded-lg text-center hover:bg-slate-700 transition-colors">
                <h2 class="text-2xl font-bold">Movies</h2>
            </a>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
